<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기상 미션</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@200;300;400;500;600&amp;family=IBM+Plex+Sans+KR:wght@300;400;500;600&amp;display=swap">
<style>
:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1)}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
a,button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform 160ms var(--ease-out),opacity 160ms var(--ease-out),background-color 160ms ease,color 160ms ease}
a:active,button:active{transform:scale(0.97)}
[data-row]:active{transform:none;background-color:rgba(255,255,255,0.06)!important}
[data-plain]:active,[role=switch]:active,nav a:active{transform:none}
nav a:active{opacity:0.55}
.sheet{animation:sheet-in 500ms var(--ease-drawer) both}
@keyframes sheet-in{from{transform:translateY(100%)}}
@keyframes fade-in{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.sheet{animation:fade-in 200ms ease both}}
a:focus-visible,button:focus-visible{outline:2px solid #FFB547;outline-offset:2px}
.draw-circle{stroke-dasharray:63;stroke-dashoffset:63;animation:draw 560ms var(--ease-out) 60ms forwards}
.draw-check{stroke-dasharray:14;stroke-dashoffset:14;animation:draw 320ms var(--ease-out) 480ms forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.shake{animation:shake 320ms var(--ease-out)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.draw-circle,.draw-check{animation:none;stroke-dashoffset:0}.shake{animation:none}}
.lvl{transform-origin:50% 50%;animation:lvl 900ms ease-in-out infinite alternate}
@keyframes lvl{from{transform:scaleY(0.35)}to{transform:scaleY(1)}}
.pop{animation:pop 380ms var(--ease-out) both}
@keyframes pop{from{opacity:0;transform:scale(0.9)}}
@media (prefers-reduced-motion: reduce){.lvl{animation:none}.pop{animation:fade-in 200ms ease both}}
</style>
</helmet>
<div style="{{rootStyle}}">
<div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; height: 54px; padding-top: 6px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; z-index: 30; pointer-events: none; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'IBM Plex Sans', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: -0.3px;"><span style="width: 132px; text-align: center">7:01</span><span style="position: absolute; top: 11px; left: 50%; width: 126px; height: 37px; margin-left: -63px; border-radius: 20px; background: #000000"></span><span style="width: 132px; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="12" viewBox="0 0 18 12" fill="#FFFFFF"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.4a9.3 9.3 0 0 1 13 0"></path><path d="M4.1 7.1a5.6 5.6 0 0 1 7.8 0"></path><circle cx="8" cy="10" r="1.3" fill="#FFFFFF" stroke="none"></circle></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.8" fill="none" stroke="#FFFFFF" stroke-opacity="0.4"></rect><rect x="2" y="2" width="20" height="9" rx="2.4" fill="#FFFFFF"></rect><path d="M25 4.6v3.8c.8-.3 1.3-1.1 1.3-1.9s-.5-1.6-1.3-1.9z" fill="#FFFFFF" fill-opacity="0.45"></path></svg></span></div><span aria-hidden="true" style="position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #FFFFFF; opacity: 0.85; z-index: 30; pointer-events: none"></span>

<sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
  <div style="height: 44px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; gap: 6px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="2"><span style="{{b.style}}"></span></sc-for>
    </div>
    <span style="font-size: 14px; color: #98989F">{{progress}}</span>
  </div>
  <div style="padding: 0 24px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #98989F">
    <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FFB547" d="M3 9.5v5c0 .6.4 1 1 1h3l4.3 3.6c.7.5 1.7.1 1.7-.8V5.7c0-.9-1-1.3-1.7-.8L7 8.5H4c-.6 0-1 .4-1 1z"></path><path d="M16.3 8.7a4.8 4.8 0 0 1 0 6.6M19 6.2a8.4 8.4 0 0 1 0 11.6" fill="none" stroke="#FFB547" stroke-width="1.8" stroke-linecap="round"></path></svg>
    알람이 울리고 있어요. 미션을 다 끝내면 꺼져요.
  </div>
</sc-if>

<sc-if value="{{stage === 0}}" hint-placeholder-val="{{ true }}">
  <div style="padding: 22px 24px 0; display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 15px; color: #98989F">사진 찍기 · 우리집 물건 찾기</span>
    <span style="font-size: 28px; font-weight: 600; letter-spacing: -0.4px">{{target}}을 찾아서 찍어 주세요</span>
    <button type="button" onClick="{{swap}}" style="{{swapStyle}}">다른 물건으로 바꾸기 · {{swaps}}번 남음</button>
  </div>
  <div style="position: absolute; top: 250px; left: 20px; right: 20px; height: 400px; border-radius: 28px; overflow: hidden; background: radial-gradient(120% 90% at 50% 70%, #2B2620 0%, #14110E 60%, #0A0908 100%)">
    <svg width="350" height="400" viewBox="0 0 350 400" aria-hidden="true" style="position: absolute; inset: 0"><g fill="rgba(255,240,220,0.05)" stroke="rgba(255,240,220,0.32)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M14 262h322" fill="none"></path><path d="M30 262v10M320 262v10" fill="none"></path>
<path d="M52 196h52v52a14 14 0 0 1-14 14H66a14 14 0 0 1-14-14z"></path><path d="M104 208c16 0 16 30 0 30" fill="none"></path><path d="M64 184c0-8 6-8 6-14M82 184c0-8 6-8 6-14" fill="none" stroke-opacity="0.5"></path>
<path d="M150 214h40l-4 48h-32z"></path><path d="M162 214l-6-62M178 214l8-58" fill="none"></path><rect x="151" y="140" width="10" height="16" rx="3"></rect><rect x="182" y="142" width="10" height="16" rx="3"></rect>
<path d="M226 118h100" fill="none"></path><path d="M236 118h80v116c0 6-4 10-10 10h-60c-6 0-10-4-10-10z"></path><path d="M236 206h80" fill="none" stroke-opacity="0.6"></path><path d="M236 216h80" fill="none" stroke-opacity="0.6"></path>
</g></svg>
    <sc-if value="{{snap}}" hint-placeholder-val="{{ false }}">
      <div class="pop" style="{{box}}"><span style="position: absolute; left: -2px; top: -30px; padding: 4px 10px; border-radius: 8px; background: #FFB547; color: #1A1205; font-size: 13px; font-weight: 600; white-space: nowrap">{{target}} 찾았어요</span></div>
    </sc-if>
    <sc-if value="{{!snap}}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 8px 14px; border-radius: 16px; background: rgba(0,0,0,0.5); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); font-size: 13px; color: #E5E5EA; white-space: nowrap">{{target}}이 화면에 들어오게 찍어 주세요</div>
    </sc-if>
  </div>
  <button type="button" onClick="{{shoot}}" aria-label="사진 찍기" style="position: absolute; left: 50%; bottom: 58px; margin-left: -38px; width: 76px; height: 76px; border-radius: 38px; border: 4px solid #FFFFFF; background: transparent; padding: 4px; box-sizing: border-box"><span style="display: block; width: 100%; height: 100%; border-radius: 50%; background: #FFFFFF"></span></button>
</sc-if>

<sc-if value="{{stage === 1}}" hint-placeholder-val="{{ false }}">
  <div style="padding: 22px 24px 0; display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 15px; color: #98989F">말하기 · 따라 말하기</span>
    <span style="font-size: 28px; font-weight: 600; letter-spacing: -0.4px">이 문장을 소리 내어 읽어 주세요</span>
  </div>
  <div style="position: absolute; top: 300px; left: 24px; right: 24px; font-size: 38px; font-weight: 600; letter-spacing: -0.6px; line-height: 1.35">
    <sc-for list="{{words}}" as="w" hint-placeholder-count="4"><span style="{{w.style}}">{{w.text}} </span></sc-for>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 172px; height: 28px; display: flex; justify-content: center; align-items: center; gap: 4px">
    <sc-for list="{{levels}}" as="l" hint-placeholder-count="7"><span class="lvl" style="{{l}}"></span></sc-for>
  </div>
  <button type="button" onClick="{{say}}" aria-label="말하기" style="position: absolute; left: 50%; bottom: 58px; margin-left: -38px; width: 76px; height: 76px; border-radius: 38px; border: none; background: #FFB547; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 10px rgba(255,181,71,0.14)"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5" fill="#1A1205"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5v3.5" fill="none" stroke="#1A1205" stroke-width="2" stroke-linecap="round"></path></svg></button>
</sc-if>

<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
  <div style="position: absolute; top: 210px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle class="draw-circle" cx="12" cy="12" r="10" transform="rotate(-90 12 12)"></circle><path class="draw-check" d="M7.5 12.5l3 3 6-6.5"></path></svg>
    <span style="margin-top: 14px; font-size: 30px; font-weight: 600; letter-spacing: -0.5px">알람을 껐어요</span>
    <span style="font-size: 15px; color: #C7C7CC">문장을 끝까지 읽었어요.</span>
  </div>
  <a href="WakeDone.dc.html" style="position: absolute; left: 24px; right: 24px; bottom: 40px; height: 54px; border-radius: 27px; background: #FFFFFF; color: #000000; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">좋은 아침</a>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { stage: 1, snap: false, heard: 0, ti: 0, swaps: 1 };
  }
  renderVals() {
    const sentence = ['오늘도', '개운하게', '하루를', '시작해요'];
    // 미션 하나를 끝낼 때마다 아래쪽부터 새벽빛이 올라와요
    const skies = [
      '#000000',
      'linear-gradient(0deg, #3A260E 0%, #120C06 75%)',
      'linear-gradient(0deg, #4E3313 0%, #20160A 100%)'
    ];
    const { stage, snap, heard, ti, swaps } = this.state;
    const targets = [
      ['컵', 'left: 38px; top: 166px; width: 86px; height: 112px'],
      ['칫솔', 'left: 140px; top: 132px; width: 64px; height: 142px'],
      ['수건', 'left: 224px; top: 106px; width: 104px; height: 150px']
    ];
    const target = targets[ti][0];
    const box = 'position: absolute; ' + targets[ti][1] + '; border: 2px dashed #FFB547; border-radius: 12px';
    const swap = () => { if (swaps > 0 && !snap) this.setState({ ti: (ti + 1) % targets.length, swaps: swaps - 1 }); };
    const swapStyle = 'align-self: flex-start; margin-top: 2px; padding: 6px 0; border: none; background: none; font-size: 15px; ' + (swaps > 0 ? 'color: #FFB547' : 'color: #5A5A5F; pointer-events: none');
    const done = stage >= 2;
    const shoot = () => {
      if (snap) return;
      this.setState({ snap: true });
      setTimeout(() => this.setState({ stage: 1, snap: false }), 1100);
    };
    const say = () => {
      const n = heard + 1;
      if (n >= sentence.length) {
        this.setState({ heard: n });
        setTimeout(() => this.setState({ stage: 2 }), 500);
      } else this.setState({ heard: n });
    };
    const words = sentence.map((w, i) => ({
      text: w,
      style: 'transition: color 240ms ease; color: ' + (i < heard ? '#FFFFFF' : '#4A4A4E')
    }));
    const levels = [10, 18, 26, 14, 22, 12, 8].map((hgt, i) =>
      'width: 4px; height: ' + hgt + 'px; border-radius: 2px; background: #FFB547; animation-delay: ' + (i * 120) + 'ms');
    const bars = [].map((idx) => ({
      style: 'width: 28px; height: 4px; border-radius: 2px; background: ' +
        (idx < stage ? '#FFB547' : idx === stage ? '#FFFFFF' : 'rgba(255,255,255,0.16)')
    }));
    return {
      rootStyle: 'width: 390px; height: 844px; box-sizing: border-box; padding-top: 54px; position: relative; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, SF Pro Text, Apple SD Gothic Neo, IBM Plex Sans KR, IBM Plex Sans, sans-serif; word-break: keep-all; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; color: #FFFFFF; transition: background 600ms ease; background: ' + skies[Math.min(stage, 2)],
      stage, snap, done, notDone: !done, shoot, say, words, levels, bars, target, box, swap, swaps, swapStyle,
      progress: ''
    };
  }
}
</script>
</body>
</html>
