<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>리포트 날짜 선택</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@200;300;400;500;600&amp;family=IBM+Plex+Sans+KR:wght@300;400;500;600&amp;display=swap">
<style>
:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1)}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
a,button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform 160ms var(--ease-out),opacity 160ms var(--ease-out),background-color 160ms ease,color 160ms ease}
a:active,button:active{transform:scale(0.97)}
[data-row]:active{transform:none;background-color:rgba(255,255,255,0.06)!important}
[data-plain]:active,[role=switch]:active,nav a:active{transform:none}
nav a:active{opacity:0.55}
.sheet{animation:sheet-in 500ms var(--ease-drawer) both}
@keyframes sheet-in{from{transform:translateY(100%)}}
@keyframes fade-in{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.sheet{animation:fade-in 200ms ease both}}
a:focus-visible,button:focus-visible{outline:2px solid #FFB547;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Apple SD Gothic Neo', 'IBM Plex Sans KR', 'IBM Plex Sans', sans-serif; word-break: keep-all; font-variant-numeric: tabular-nums; position: relative; overflow: hidden; -webkit-font-smoothing: antialiased">
<div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; height: 54px; padding-top: 6px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; z-index: 30; pointer-events: none; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'IBM Plex Sans', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: -0.3px;"><span style="width: 132px; text-align: center">7:21</span><span style="position: absolute; top: 11px; left: 50%; width: 126px; height: 37px; margin-left: -63px; border-radius: 20px; background: #000000"></span><span style="width: 132px; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="12" viewBox="0 0 18 12" fill="#FFFFFF"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.4a9.3 9.3 0 0 1 13 0"></path><path d="M4.1 7.1a5.6 5.6 0 0 1 7.8 0"></path><circle cx="8" cy="10" r="1.3" fill="#FFFFFF" stroke="none"></circle></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.8" fill="none" stroke="#FFFFFF" stroke-opacity="0.4"></rect><rect x="2" y="2" width="20" height="9" rx="2.4" fill="#FFFFFF"></rect><path d="M25 4.6v3.8c.8-.3 1.3-1.1 1.3-1.9s-.5-1.6-1.3-1.9z" fill="#FFFFFF" fill-opacity="0.45"></path></svg></span></div><span aria-hidden="true" style="position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #FFFFFF; opacity: 0.85; z-index: 30; pointer-events: none"></span>
<a href="Records.dc.html" aria-label="닫기" data-plain style="position: absolute; top: 0; left: 0; right: 0; height: 160px"></a>

<div class="sheet" style="position: absolute; left: 0; right: 0; bottom: 0; top: 160px; box-sizing: border-box; border-radius: 28px 28px 0 0; box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); background: #1C1C1E; padding: 10px 24px 30px; display: flex; flex-direction: column">
  <div aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.18)"></div>

  <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.3px">다른 날짜 보기</span>
    <span style="font-size: 13px; color: #98989F">리포트 탭은 늘 오늘 리포트로 열려요. 지난 날짜는 여기서 골라요.</span>
  </div>

  <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; max-height: 390px">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="10">
      <button type="button" data-row onClick="{{d.pick}}" style="{{d.row}}">
        <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px">
          <span style="{{d.labelStyle}}">{{d.label}}</span>
          <span style="font-size: 12px; color: #6C6C70">{{d.sub}}</span>
        </span>
        <span style="display: flex; align-items: center; gap: 10px">
          <span style="font-size: 15px; color: #C7C7CC">{{d.snore}}</span>
          <sc-if value="{{d.selected}}" hint-placeholder-val="{{ false }}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFB547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M8 12l3 3 5-6"></path></svg>
          </sc-if>
        </span>
      </button>
    </sc-for>
  </div>

  <a href="Records.dc.html" style="margin-top: 16px; height: 54px; border-radius: 27px; background: #FFFFFF; color: #000000; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">{{ctaLabel}} 리포트 보기</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0 };
  }
  renderVals() {
    const names = ['일', '월', '화', '수', '목', '금', '토'];
    const snores = [12, 18, 7, 0, 25, 9, 14, 5, 21, 10];
    const durations = ['7시간 37분', '6시간 12분', '6시간 50분', '7시간 55분', '5시간 40분', '7시간 10분', '6시간 30분', '7시간 2분', '5시간 58분', '7시간 20분'];
    const baseMonth = 10, baseDay = 10, baseDow = 5; // 10/10 금요일 = index 5
    const days = snores.map((sn, i) => {
      const day = baseDay - i;
      const dow = names[((baseDow - i) % 7 + 7) % 7];
      const label = (day > 0 ? '10월 ' + day + '일' : '9월 ' + (30 + day) + '일') + ' ' + dow + '요일';
      const sub = i === 0 ? '오늘 · ' + durations[i] : durations[i];
      const on = this.state.sel === i;
      return {
        label,
        sub,
        snore: sn === 0 ? '코골이 없음' : '코골이 ' + sn + '분',
        selected: on,
        labelStyle: 'font-size: 15px; font-weight: ' + (on ? '600' : '500'),
        pick: () => this.setState({ sel: i }),
        row: 'margin: 0; border: none; background: ' + (on ? 'rgba(255,181,71,0.16)' : 'transparent') + '; border-radius: 12px; padding: 10px 10px; display: flex; align-items: center; justify-content: space-between; text-align: left'
      };
    });
    return {
      days,
      ctaLabel: this.state.sel === 0 ? '오늘' : days[this.state.sel].label.split(' ').slice(0, 2).join(' ')
    };
  }
}
</script>
</body>
</html>
