<style>
:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1)}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
a,button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform 160ms var(--ease-out),opacity 160ms var(--ease-out),background-color 160ms ease,color 160ms ease}
a:active,button:active{transform:scale(0.97)}
[data-row]:active{transform:none;background-color:rgba(255,255,255,0.06)!important}
[data-plain]:active,[role=switch]:active,nav a:active{transform:none}
nav a:active{opacity:0.55}
.sheet{animation:sheet-in 500ms var(--ease-drawer) both}
@keyframes sheet-in{from{transform:translateY(100%)}}
@keyframes fade-in{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.sheet{animation:fade-in 200ms ease both}}
a:focus-visible,button:focus-visible{outline:2px solid #FF9F0A;outline-offset:2px}
.tbar{transform-origin:left center;animation:tbar 90s linear forwards}@keyframes tbar{to{transform:scaleX(0)}}.arc{transition:stroke-dashoffset 1s linear}@media (prefers-reduced-motion: reduce){.tbar{animation:none}.arc{transition:none}}</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { l: false, r: false, sound: false };
  }
  renderVals() {

    const sound = !!this.state.sound;
    const top = {
      sound, soundOn: sound ? 'true' : 'false',
      toggleSound: () => this.setState({ sound: !this.state.sound }),
      track: 'width: 62px; height: 30px; border-radius: 999px; border: none; padding: 0; position: relative; flex-shrink: 0; transition: background-color 240ms ease; background: ' + (sound ? '#FF9F0A' : '#3A3A3C'),
      knob: 'position: absolute; top: 2px; left: 2px; width: 38px; height: 26px; border-radius: 999px; background: #FFFFFF; transition: transform 280ms cubic-bezier(0.23, 1, 0.32, 1); transform: translateX(' + (sound ? '20px' : '0') + ')'
    };
    const go = (href, ms) => setTimeout(() => { window.location.href = href; }, ms);

    const { l, r } = this.state;
    const area = (side, on) => 'position: absolute; top: 236px; ' + side + ': -122px; width: 244px; height: 640px; border: none; padding: 0; border-radius: 50%; transition: background-color 200ms ease; background: ' + (on ? '#FF9F0A' : '#474B54');
    const tap = (k) => () => {
      if (this.state[k]) return;
      const next = Object.assign({}, this.state, { [k]: true });
      this.setState({ [k]: true });
      if (next.l && next.r) go('MissionSquatCount.dc.html', 450);
    };
    return Object.assign(top, { lStyle: area('left', l), rStyle: area('right', r), lOn: l ? 'true' : 'false', rOn: r ? 'true' : 'false', tapL: tap('l'), tapR: tap('r') });
  }
}
</script>
