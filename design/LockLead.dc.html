<style>
:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1)}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
a,button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform 160ms var(--ease-out),opacity 160ms var(--ease-out),background-color 160ms ease,color 160ms ease}
a:active,button:active{transform:scale(0.97)}
[data-row]:active{transform:none;background-color:rgba(255,255,255,0.06)!important}
[data-plain]:active,[role=switch]:active,nav a:active{transform:none}
nav a:active{opacity:0.55}
.sheet{animation:sheet-in 500ms var(--ease-drawer) both}
@keyframes sheet-in{from{transform:translateY(100%)}}
@keyframes fade-in{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.sheet{animation:fade-in 200ms ease both}}
a:focus-visible,button:focus-visible{outline:2px solid #FF9F0A;outline-offset:2px}
</style>

d: #141415"></div><div class="sheet" style="position: absolute; top: 58px; left: 0; right: 0; bottom: 0; border-radius: 34px 34px 0 0; background: #1C1C1E; box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); padding: 8px 16px 34px; display: flex; flex-direction: column; gap: 18px"><div style="display: flex; justify-content: space-between; align-items: center; height: 60px; padding: 0 4px"><a href="PlanEdit.dc.html" aria-label="닫기" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(120,120,128,0.32); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"></path></svg></a><span style="font-size: 17px; font-weight: 600">잠그는 시각</span><a href="PlanEdit.dc.html" aria-label="저장" style="width: 44px; height: 44px; border-radius: 22px; background: #FF9F0A; box-shadow: inset 0 1px 0 rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5l4 4 8-9"></path></svg></a></div><div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0 0"><span style="font-size: 17px; font-weight: 600; color: #FFFFFF">취침 몇 시간 전에 앱을 잠글까요?</span></div><div style="margin-top: 8px"><div style="position: relative; height: 252px; display: flex; justify-content: center; align-items: center; -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 24%, #000 76%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0%, #000 24%, #000 76%, transparent 100%)"><div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 105px; height: 42px; border-radius: 14px; backg <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":600}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { ll: 1 };
  }
  renderVals() {

    const LEADS = [30, 60, 90, 120];
    const leadText = (m) => {
        const h = Math.floor(m / 60), r = m % 60;
        if (h === 0) return r + '분 전';
        if (r === 0) return h + '시간 전';
        return h + '시간 ' + r + '분 전';
    };

    const st = this.state;
    const self = this;
    const mod = (a, n) => ((a % n) + n) % n;
    const pad = (n) => String(n).padStart(2, '0');
    const fmt = (m) => { const h = Math.floor(mod(m, 1440) / 60), mn = mod(m, 60); return (h < 12 ? '오전 ' : '오후 ') + (h % 12 || 12) + ':' + pad(mn); };
    const leadLabelOnly = (m) => {
        const h = Math.floor(m / 60), r = m % 60;
        if (h === 0) return r + '분';
        if (r === 0) return h + '시간';
        return h + '시간 ' + r + '분';
    };
    const out = {};
    const ROW = 42, MID = 105;
    const clampP = (p, n) => Math.max(0, Math.min(n - 1, p));
    const settle = (key, n, target) => {
        const from = self.state[key];
        const to = clampP(target === undefined ? Math.round(from) : target, n);
        const t0 = performance.now();
        const step = (t) => {
            const k = Math.min(1, (t - t0) / 260), e = 1 - Math.pow(1 - k, 3);
            self.setState({ [key]: from + (to - from) * e });
            if (k < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
    };
    const makeCol = (key, values, fmtFn, align) => {
        const pos = self.state[key], n = values.length, base = Math.round(pos);
        const items = [];
        for (let k = -3; k <= 3; k++) {
            const i = base + k;
            if (i < 0 || i >= n) continue;
            const d = i - pos, ad = Math.abs(d);
            items.push({
                label: fmtFn(values[i]),
                pick: () => settle(key, n, i),
                style: 'position: absolute; left: 0; right: 0; height: ' + ROW + 'px; display: flex; align-items: center; justify-content: ' + align +
                    '; top: ' + (MID + d * ROW).toFixed(1) + 'px; font-size: 26px; font-variant-numeric: tabular-nums; user-select: none; ' +
                    'transform: perspective(380px) rotateX(' + (-d * 19).toFixed(1) + 'deg); opacity: ' +
                    Math.max(0, 1 - ad * 0.27).toFixed(2) + '; color: ' + (ad < 0.5 ? '#FFFFFF' : '#8E8E93')
            });
        }
        const now = fmtFn(values[Math.round(pos)]);
        const down = (e) => {
            if (e && e.preventDefault) e.preventDefault();
            const y0 = e.clientY, p0 = self.state[key];
            const move = (ev) => self.setState({ [key]: clampP(p0 - (ev.clientY - y0) / ROW, n) });
            const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); settle(key, n); };
            window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
        };
        const wheel = (e) => {
            const t = Date.now(); self._wt = self._wt || {};
            if (t - (self._wt[key] || 0) < 70 || !e.deltaY) return;
            self._wt[key] = t;
            settle(key, n, clampP(Math.round(self.state[key]) + Math.sign(e.deltaY), n));
        };
        const keyFn = (e) => {
            if (e.key === 'ArrowDown') { e.preventDefault && e.preventDefault(); settle(key, n, clampP(Math.round(self.state[key]) + 1, n)); }
            if (e.key === 'ArrowUp') { e.preventDefault && e.preventDefault(); settle(key, n, clampP(Math.round(self.state[key]) - 1, n)); }
        };
        return { items, now, down, wheel, key: keyFn };
    };
    const ll = makeCol('ll', LEADS, leadLabelOnly, 'center');
    const li = Math.round(st.ll);
    const safeTotal = LEADS[li];
    const bedMin = 1410; // 취침 23:30 기본값 (PlanEdit 연동 전 임시)
    out.llItems = ll.items; out.llNow = ll.now; out.llDown = ll.down; out.llWheel = ll.wheel; out.llKey = ll.key;
    out.lockAt = fmt(bedMin - safeTotal);
    return out;

  }
}
</script>
