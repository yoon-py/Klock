<style>
:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1)}

a{color:inherit;text-decoration:none}

.sheet{animation:sheet-in 500ms var(--ease-drawer) both}

@keyframes fade-in{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.sheet{animation:fade-in 200ms ease both}}
a:focus-visible,button:focus-visible{outline:2px solid #FF9F0A;outline-offset:2px}
.tbar{transform-origin:left center;animation:tbar 90s linear forwards}@keyframes tbar{to{transform:scaleX(0)}}.arc{transition:stroke-dashoffset 1s linear}@media (prefers-reduced-motion: reduce){.tbar{animation:none}.arc{transition:none}}</style>

"><div class="tbar" style="height: 100%; background: #FFFFFF"></div></div><div style="position: absolute; top: 58px; left: 0; right: 0; height: 56px; padding: 0 20px 0 8px; display: flex; align-items: center; justify-content: space-between; z-index: 20"><a href="Alarm.dc.html" aria-label="알람으로 돌아가기" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2L2 10l8 8"></path></svg></a><span style="display: flex; align-items: center; gap: 10px"><svg width="26" height="20" viewBox="0 0 26 24" aria-hidden="true"><path fill="#8E8E93" d="M3 9.2h3.2L10.6 5c.6-.6 1.4-.2 1.4.6v12.8c0 .8-.8 1.2-1.4.6l-4.4-4.2H3a1 1 0 0 1-1-1v-3.6a1 1 0 0 1 1-1z"></path><sc-if value="{{!sound}}" hint-placeholder-val="{{ true }}"><path d="M16 9l5 5M21 9l-5 5" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"></path></sc-if><sc-if value="{{sound}}" hint-placeholder-val="{{ false }}"><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"></path></sc-if></svg><button type="button" role="switch" aria-checked="{{soundOn}}" aria-label="미션 소리" onClick="{{toggleSound}}" style="{{track}}"><span style="{{knob}}"></span></button></span></div><p style="position: absolute; top: 300px; left: 24px; right: 24px; margin: 0; font-size: 27px; font-weight: 600; letter-spacing: -0.5px; text-align: center">가볍게 걸으세요</p><div role="status" aria-label="{{leftLabel}}" style="position: absolute; top: 400px; left: 0; right: 0; height: 160px"><sc-for list="{{nums}}" as="o" hint-placeholder-count="3"><span aria-hidden="true" style="{{o.style}}">{{o.label}}</span></sc-for></div><button type="button" aria-label="한 걸음 (시연)" onClick="{{rep}}" style="position: absolute; left: 0; right: 0; top: 260px; bottom: 0; border: none; background: none"></button><sc-if value="{{ask}}" hint-placeholder-val="{{ true }}"><div style="position: absolute; inset: 0; background: rgba(0,0,0,0.45); z-index: 40"></div><div role="alertdialog" aria-modal="true" aria-labelledby="permT" style="position: absolute; left: 28px; right: 28px; top: 236px; z-index: 41; padding: 24px; border-radius: 34px; background: rgba(48,48,52,0.88); -webkit-backdrop-filter: blur(30px) saturate(160%); backdrop-filter: blur(30px) saturate(160%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 20px 50px rgba(0,0,0,0.5); display: flex; flex-direction: column"><div style="position: relative; width: 66px; height: 66px; border-radius: 16px; background: linear-gradient(180deg, #6FD38A, #34B05A); display: flex; align-items: center; justify-content: center"><svg width="38" height="38" viewBox="0 0 24 24" aria-hidden="true"><g fill="#FFFFFF"><ellipse cx="8.2" cy="7.5" rx="3" ry="4.6" transform="rotate(-8 8.2 7.5)"></ellipse><ellipse cx="8.8" cy="15.4" rx="2.2" ry="1.9"></ellipse><ellipse cx="15.8" cy="10.5" rx="3" ry="4.6" transform="rotate(8 15.8 10.5)"></ellipse><ellipse cx="15.2" cy="18.4" rx="2.2" ry="1.9"></ellipse></g></svg><span style="position: absolute; right: -10px; bottom: -8px; width: 30px; height: 30px; border-radius: 8px; background: #3B82F6; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FFFFFF" d="M8 21c-2-1.6-3.4-4-3.6-7l-.6-4.6c-.1-.8.5-1.4 1.2-1.4.6 0 1 .4 1.1 1l.5 3V4.3c0-.8.6-1.3 1.3-1.3s1.3.5 1.3 1.3V10V3.2c0-.7.6-1.2 1.3-1.2s1.3.5 1.3 1.2V10V4.2c0-.7.6-1.2 1.3-1.2s1.3.5 1.3 1.2V11V7c0-.7.6-1.2 1.3-1.2s1.2.5 1.2 1.2v7.6c0 2.7-1 5-2.8 6.4z"></path></svg></span></div><h2 id="permT" style="margin: 22px 0 0; font-size: 18px; font-weight: 600; line-height: 1.38; letter-spacing: -0.3px">‘Slipper’이(가) 사용자의 동작 및 피트니스 활동에 접근하도록 허용하겠습니까?</h2><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.4; color: #8E8E93">걷기 미션에서 걸음 수를 세는 데 필요해요.</p><div s <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { left: 50, ask: true, sound: false };
  }
  renderVals() {

    const sound = !!this.state.sound;
    const top = {
      sound, soundOn: sound ? 'true' : 'false',
      toggleSound: () => this.setState({ sound: !this.state.sound }),
      track: 'width: 62px; height: 30px; border-radius: 999px; border: none; padding: 0; position: relative; flex-shrink: 0; transition: background-color 240ms ease; background: ' + (sound ? '#FF9F0A' : '#3A3A3C'),
      knob: 'position: absolute; top: 2px; left: 2px; width: 38px; height: 26px; border-radius: 999px; background: #FFFFFF; transition: transform 280ms cubic-bezier(0.23, 1, 0.32, 1); transform: translateX(' + (sound ? '20px' : '0') + ')'
    };
    const go = (href, ms) => setTimeout(() => { window.location.href = href; }, ms);

    const left = this.state.left;
    const nums = [];
    for (let v = 0; v <= 50; v++) {
      const d = left - v, ad = Math.abs(d);
      if (ad > 2) continue;
      nums.push({ label: String(v), style: 'position: absolute; top: 0; left: 0; width: 390px; height: 160px; display: flex; align-items: center; justify-content: center; font-size: 128px; font-weight: 600; letter-spacing: -2px; transition: transform 300ms cubic-bezier(0.23, 1, 0.32, 1), color 300ms ease; transform: translateX(' + (d * 205) + 'px) scale(' + (ad < 0.5 ? 1 : 0.86) + '); color: ' + (ad < 0.5 ? '#FFFFFF' : '#8E8E93') });
    }
    const rep = () => {
      if (this.state.ask || this.state.left <= 0) return;
      const n = this.state.left - 1;
      this.setState({ left: n });
      if (n === 0) go('WakeDone.dc.html', 700);
    };
    return Object.assign(top, { nums, rep, ask: this.state.ask, allow: () => this.setState({ ask: false }), deny: () => this.setState({ ask: false }),
      leftLabel: left > 0 ? left + '걸음 남았어요' : '다 걸었어요' });
  }
}
</script>
