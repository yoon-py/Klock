<style>
:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1)}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
a,button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform 160ms var(--ease-out),opacity 160ms var(--ease-out),background-color 160ms ease,color 160ms ease}
a:active,button:active{transform:scale(0.97)}
[data-row]:active{transform:none;background-color:rgba(255,255,255,0.06)!important}
[data-plain]:active,[role=switch]:active,nav a:active{transform:none}
nav a:active{opacity:0.55}
.sheet{animation:sheet-in 500ms var(--ease-drawer) both}
@keyframes sheet-in{from{transform:translateY(100%)}}
@keyframes fade-in{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.sheet{animation:fade-in 200ms ease both}}
a:focus-visible,button:focus-visible{outline:2px solid #FF9F0A;outline-offset:2px}
.spin{animation:spin 900ms linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.eq{animation:eq 520ms ease-in-out infinite alternate;transform-origin:center}@keyframes eq{from{transform:scaleY(0.4)}to{transform:scaleY(1)}}.halo{animation:halo 1.2s ease-out infinite}@keyframes halo{from{transform:scale(0.82);opacity:1}to{transform:scale(1.12);opacity:0.2}}.popin{animation:popin 420ms cubic-bezier(0.34,1.56,0.64,1) both}@keyframes popin{from{transform:scale(0.4);opacity:0}}@media (prefers-reduced-motion: reduce){.spin,.eq,.halo,.popin{animation:none}}</style>

; letter-spacing: -0.5px">{{word}}</span></div></sc-if><sc-if value="{{grid}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; top: 372px; left: 0; right: 0; height: 180px"><sc-for list="{{tiles}}" as="o" hint-placeholder-count="8"><span style="{{o.style}}">{{o.label}}</span></sc-for></div></sc-if><sc-if value="{{counting}}" hint-placeholder-val="{{ false }}"><span aria-live="assertive" style="position: absolute; top: 360px; left: 0; right: 0; height: 200px; display: flex; align-items: center; justify-content: center; font-size: 168px; font-weight: 900; line-height: 1; color: #FFD43B; -webkit-text-stroke: 7px #6B2E0A; paint-order: stroke fill; text-shadow: 0 8px 0 #4A1F07; font-family: 'Arial Rounded MT Bold', 'SF Pro Rounded', -apple-system, sans-serif">{{cd}}</span></sc-if><sc-if value="{{listening}}" hint-placeholder-val="{{ false }}"><div aria-label="듣는 중" role="img" style="position: absolute; top: 650px; left: 50%; width: 132px; height: 132px; margin-left: -66px; display: flex; align-items: center; justify-content: center"><span class="halo" aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; background: rgba(255,106,43,0.35)"></span><span style="position: relative; width: 104px; height: 104px; border-radius: 52px; background: #FF6A2B; display: flex; align-items: center; justify-content: center"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="#FFFFFF" stroke="none"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg></span></div></sc-if><sc-if value="{{done}}" hint-placeholder-val="{{ false }}"><a href="WakeDone.dc.html" aria-label="알람 해제, 다음으로" class="popin" style="position: absolute; top: 410px; left: 50%; width: 110px; height: 110px; margin-left: -55px; border-radius: 55px; background: linear-gradient(145deg, #86E02A 0%, #2DB411 100%); display: flex; align-items <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { t: 0 };
    // 시작 전 → 3·2·1 → 말하기 → 해제를 15초마다 되풀이해요 (실제 앱은 해제 뒤 다음 화면으로 넘어가요)
    this.timer = setInterval(() => this.setState({ t: (this.state.t + 100) % 15000 }), 100);
  }
  renderVals() {

    const t = this.state.t;
    const WORDS = ["일어나자", "힘을내자"], EMOJI = ["\u23f0", "\ud83d\udcaa"], CH = ["일", "어", "나", "자", "힘", "을", "내", "자"];
    const intro = t < 3600, fill = t >= 3600 && t < 4400, counting = t >= 4400 && t < 7400, speak = t >= 7400 && t < 12600, done = t >= 12600;
    const shown = fill ? Math.floor((t - 3600) / 100) + 1 : (intro ? 0 : 8);
    const cur = speak ? Math.floor((t - 7400) / 650) : -1;
    const tiles = CH.map((ch, i) => {
      const r = Math.floor(i / 4), c = i % 4, on = i < shown;
      const st = i === cur ? 'background: #E9EDF7; color: #2A2A2E; box-shadow: 0 0 0 4px #F2C744, 0 0 22px rgba(242,199,68,0.55); transform: scale(1.03)'
        : i === cur - 1 ? 'background: rgba(150,170,235,0.45); color: rgba(255,255,255,0.8); box-shadow: 0 0 0 3px rgba(200,210,245,0.35)'
        : 'background: rgba(95,125,235,0.38); color: #FFFFFF';
      return { label: ch, style: 'position: absolute; left: ' + (12 + c * (84 + 10)) + 'px; top: ' + (r * (84 + 12)) + 'px; width: 84px; height: 84px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; transition: transform 200ms ease, background-color 200ms ease, box-shadow 200ms ease, opacity 200ms ease; ' + st + '; opacity: ' + (on ? 1 : 0) + (on ? '' : '; transform: scale(0.8)') };
    });
    const wi = t < 1800 ? 0 : 1;
    return {
      t1: speak ? '지금이에요!' : '리듬 맞춰 말하고', t2: speak ? '리듬에 맞춰 말해요' : '알람 해제',
      waiting: t < 7400,
      listening: speak, intro, grid: !intro && !done, counting, done,
      emoji: EMOJI[wi], word: WORDS[wi], cd: String(3 - Math.floor((t - 4400) / 1000)), tiles
    };
  }
}
</script>
