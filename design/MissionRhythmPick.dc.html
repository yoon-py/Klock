<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: [true, true, true, true, true, true, true, true, true, false] };
  }
  renderVals() {

    const sel = this.state.sel, out = {};
    const box = (on) => 'width: 26px; height: 26px; box-sizing: border-box; border-radius: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: background-color 160ms ease; ' + (on ? 'background: #FF9F0A; border: none' : 'background: none; border: 2px solid #636366');
    const all = sel.every(Boolean), none = !sel.some(Boolean);
    sel.forEach((on, i) => {
      out['r' + i + 'On'] = on ? 'true' : 'false';
      out['r' + i + 'Box'] = box(on);
      out['r' + i + 'Chk'] = 'opacity: ' + (on ? 1 : 0);
      out['r' + i + 'Tap'] = () => { const n = sel.slice(); n[i] = !n[i]; this.setState({ sel: n }); };
    });
    out.allOn = all ? 'true' : 'false'; out.allBox = box(all); out.allChk = 'opacity: ' + (all ? 1 : 0);
    out.allTap = () => this.setState({ sel: sel.map(() => !all) });
    out.noneOn = none ? 'true' : 'false';
    out.saveC = none ? '#636366' : '#FFFFFF';
    return out;
  }
}
