<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@200;300;400;500;600&amp;family=IBM+Plex+Sans+KR:wght@300;400;500;600&amp;display=swap">
<style>
:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1)}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
a,button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform 160ms var(--ease-out),opacity 160ms var(--ease-out),background-color 160ms ease,color 160ms ease}
a:active,button:active{transform:scale(0.97)}
[data-row]:active{transform:none;background-color:rgba(255,255,255,0.06)!important}
[data-plain]:active,[role=switch]:active,nav a:active{transform:none}
nav a:active{opacity:0.55}
.sheet{animation:sheet-in 500ms var(--ease-drawer) both}
@keyframes sheet-in{from{transform:translateY(100%)}}
@keyframes fade-in{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.sheet{animation:fade-in 200ms ease both}}
a:focus-visible,button:focus-visible{outline:2px solid #A99DFF;outline-offset:2px}
.hold-fill{clip-path:inset(0 100% 0 0);transition:clip-path 200ms var(--ease-out)}
.hold:active{transform:scale(0.98)}
.hold:active .hold-fill{clip-path:inset(0 0 0 0);transition:clip-path 1.5s linear}
@media (prefers-reduced-motion: reduce){.hold:active .hold-fill{transition:none}}
</style>
</helmet>

<div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; height: 54px; padding-top: 6px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; z-index: 30; pointer-events: none; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'IBM Plex Sans', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: -0.3px;"><span style="width: 132px; text-align: center; opacity: 0.55">11:14</span><span style="position: absolute; top: 11px; left: 50%; width: 126px; height: 37px; margin-left: -63px; border-radius: 20px; background: #000000"></span><span style="width: 132px; display: flex; align-items: center; justify-content: center; gap: 6px; opacity: 0.55"><svg width="18" height="12" viewBox="0 0 18 12" fill="#FFFFFF"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.4a9.3 9.3 0 0 1 13 0"></path><path d="M4.1 7.1a5.6 5.6 0 0 1 7.8 0"></path><circle cx="8" cy="10" r="1.3" fill="#FFFFFF" stroke="none"></circle></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.8" fill="none" stroke="#FFFFFF" stroke-opacity="0.4"></rect><rect x="2" y="2" width="17" height="9" rx="2.4" fill="#FFFFFF"></rect><path d="M25 4.6v3.8c.8-.3 1.3-1.1 1.3-1.9s-.5-1.6-1.3-1.9z" fill="#FFFFFF" fill-opacity="0.45"></path></svg></span></div><span aria-hidden="true" style="position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #FFFFFF; opacity: 0.5; z-index: 30; pointer-events: none"></span><div style="height: 44px; padding: 0 16px 0 8px; display: flex; align-items: center"><a href="Bed.dc.html" style="height: 44px; display: flex; align-items: center; gap: 6px; font-size: 17px; color: #A99DFF; padding-left: 4px"><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="#A99DFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2L2 10l8 8"></path></svg>침대 모드</a></div><sc-if value="{{asking}}" hint-placeholder-val="{{ true }}"><div style="padding: 24px 24px 0; display: flex; flex-direction: column; gap: 12px"><span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 28px; background: rgba(169,157,255,0.14); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 10V7.5a4.5 4.5 0 0 1 8.7-1.6" fill="none" stroke="#C9C2FF" stroke-width="2.2" stroke-linecap="round"></path><rect x="4.5" y="10" width="15" height="11" rx="2.6" fill="#C9C2FF"></rect></svg></span><span style="margin-top: 6px; font-size: 28px; font-weight: 600; letter-spacing: -0.4px">앱 제한을 풀까요?</span><span style="font-size: 16px; line-height: 1.55; color: #A3A7C2">전화와 긴급 통화는 지금도 쓸 수 있어요. 제한을 풀면 오늘 밤 기록에 남아요.</span></div><div role="radiogroup" aria-label="얼마나 풀까요" style="margin: 26px 20px 0; border-radius: 20px; background: rgba(160,165,255,0.08); overflow: hidden"><sc-for list="{{opts}}" as="o" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="{{o.row}}"><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 17px">{{o.title}}</span><span style="font-size: 13px; color: #A3A7C2">{{o.sub}}</span></span><span aria-hidden="true" style="{{o.radio}}"></span></button></sc-for></div><button type="button" class="hold" onClick="{{confirm}}" aria-label="길게 눌러 앱 제한 풀기" style="position: absolute; left: 20px; right: 20px; bottom: 92px; height: 56px; border-radius: 16px; border: none; overflow: hidden; background: rgba(255,255,255,0.07); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); color: #EEEFFA; font-size: 17px; font-weight: 600"><span aria-hidden="true" class="hold-fill" style="position: absolute; inset: 0; background: rgba(169,157,255,0.38)"></span><span style="position: relative">길게 눌러 풀기</span></button><a href="Bed.dc.html" style="position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); height: 44px; padding: 0 16px; display: flex; align-items: center; font-size: 15px; color: #A3A7C2">그냥 잘게요</a></sc-if><sc-if value="{{done}}" hint-placeholder-val="{{ false }}"><div style="padding: 120px 24px 0; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center"><span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 28px; background: rgba(169,157,255,0.14); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 10V7.5a4.5 4.5 0 0 1 8.7-1.6" fill="none" stroke="#C9C2FF" stroke-width="2.2" stroke-linecap="round"></path><rect x="4.5" y="10" width="15" height="11" rx="2.6" fill="#C9C2FF"></rect></svg></span><span style="margin-top: 6px; font-size: 26px; font-weight: 600">{{doneTitle}}</span><span style="font-size: 16px; line-height: 1.55; color: #A3A7C2">{{doneSub}}</span></div><a href="Bed.dc.html" style="position: absolute; left: 20px; right: 20px; bottom: 92px; height: 56px; border-radius: 16px; background: #EEEFFA; color: #12132E; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">침대 모드로 돌아가기</a></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0, done: false };
  }
  renderVals() {

    const st = this.state;
    const data = [['5분만 풀기', '5분 뒤 다시 잠겨요'], ['오늘 밤 모두 풀기', '알람과 기상 미션은 그대로 울려요']];
    const opts = data.map(([title, sub], i) => ({
      title, sub, on: st.sel === i ? 'true' : 'false',
      pick: () => this.setState({ sel: i }),
      row: 'width: 100%; display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 18px; border: none; background: none; color: #EEEFFA; text-align: left; ' +
        (i === 0 ? 'background-image: linear-gradient(rgba(255,255,255,0.08), rgba(255,255,255,0.08)); background-size: calc(100% - 18px) 0.5px; background-position: right bottom; background-repeat: no-repeat' : ''),
      radio: 'width: 22px; height: 22px; border-radius: 11px; flex-shrink: 0; box-sizing: border-box; transition: border-width 160ms ease; border: ' + (st.sel === i ? '7px solid #A99DFF' : '1.5px solid #5A5E7E')
    }));
    return {
      opts, asking: !st.done, done: st.done,
      confirm: () => this.setState({ done: true }),
      doneTitle: st.sel === 0 ? '5분 동안 풀렸어요' : '오늘 밤 제한을 풀었어요',
      doneSub: st.sel === 0 ? '23:19에 다시 잠겨요.' : '내일 07:00 알람과 스쿼트 미션은 그대로예요.'
    };
  }
}
</script>
</body>
