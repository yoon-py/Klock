      { t: 'Slipper로 무엇을\n바꾸고 싶으세요?', s: '여러 개 골라도 돼요', multi: true, key: 'goals',
        o: [['wake_up','아침에 제때 일어나기','alarm'],['sleep_early','더 일찍 잠들기','light'],['less_phone','잠들기 전 폰 덜 보기','screen'],['snore','코골이·잠꼬대 확인','mic'],['deep_sleep','푹 자기','breath']] },
      { t: '알람을 끄고 다시\n잠든 적이 있나요?', s: '아침 미션을 정하는 데 써요', key: 'morning',
        o: [['often','자주 있어요',''],['sometimes','가끔 있어요',''],['rarely','거의 없어요','']] },
      { t: '잠들기 전에 폰을\n얼마나 보세요?', s: '앱을 잠그는 시각을 정하는 데 써요', key: 'phone',
        o: [['over60','1시간 넘게',''],['30to60','30분~1시간',''],['under30','30분 안쪽','']] },
    ];
    const q = Q[st.step];
    const isOn = (k) => q.multi ? st.goals.includes(k) : st[q.key] === k;
    const pick = (k) => {
      if (q.multi) return this.setState({ goals: st.goals.includes(k) ? st.goals.filter((x) => x !== k) : [...st.goals, k] });
      this.setState({ [q.key]: k });
      setTimeout(() => { if (st.step < 2) this.setState({ step: st.step + 1 }); }, 400);
    };
    const ICONS = {"alarm": "data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2226%22%20height%3D%2226%22%20viewBox%3D%220%200%2024%2024%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2213%22%20r%3D%227.5%22%20fill%3D%22none%22%20stroke%3D%22%23A99DFF%22%20stroke-width%3D%222%22/%3E%3Cpath%20d%3D%22M12%209.5V13l2.5%202M4%205l3-2.5M20%205l-3-2.5%22%20stroke%3D%22%23A99DFF%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22/%3E%3C/svg%3E", "light": "data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2226%22%20height%3D%2226%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22M8%203h8l3%208H5z%22%20fill%3D%22%23A99DFF%22/%3E%3Cpath%20d%3D%22M12%2011v7M8%2021h8%22%20stroke%3D%22%23A99DFF%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2214%22%20r%3D%225%22%20fill%3D%22%23FFF1D6%22%20opacity%3D%220.18%22/%3E%3C/svg%3E", "screen": "data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2226%22%20height%3D%2226%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20x%3D%227%22%20y%3D%222.5%22%20width%3D%2210%22%20height%3D%2219%22%20rx%3D%222.5%22%20fill%3D%22none%22%20stroke%3D%22%23A99DFF%22%20stroke-width%3D%222%22/%3E%3Cpath%20d%3D%22M10%2018.5h4%22%20stroke%3D%22%23A99DFF%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2210%22%20r%3D%223%22%20fill%3D%22%23FFF1D6%22%20opacity%3D%220.6%22/%3E%3C/svg%3E", "mic": "data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2226%22%20height%3D%2226%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20x%3D%228.5%22%20y%3D%222.5%22%20width%3D%227%22%20height%3D%2212%22%20rx%3D%223.5%22%20fill%3D%22%23A99DFF%22/%3E%3Cpath%20d%3D%22M5.5%2011a6.5%206.5%200%200%200%2013%200M12%2017.5v3.5%22%20fill%3D%22none%22%20stroke%3D%22%23A99DFF%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E", "breath": "data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2226%22%20height%3D%2226%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cg%20fill%3D%22%23A99DFF%22%20opacity%3D%220.55%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%227.5%22%20r%3D%224.5%22/%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2216.5%22%20r%3D%224.5%22/%3E%3Ccircle%20cx%3D%227.5%22%20cy%3D%2212%22%20r%3D%224.5%22/%3E%3Ccircle%20cx%3D%2216.5%22%20cy%3D%2212%22%20r%3D%224.5%22/%3E%3C/g%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%222.2%22%20fill%3D%22%23FFF1D6%22/%3E%3C/svg%3E"};
    return {
      title: q.t.split('\n'), sub: q.s,
      bars: [0,1,2].map((i) => ({ style: 'flex:1;height:4px;border-radius:2px;background:' + (i <= st.step ? '#A99DFF' : 'rgba(255,255,255,0.14)') })),
      opts: q.o.map(([k, label, ic]) => ({
        label, tap: () => pick(k), on: isOn(k) ? 'true' : 'false', icon: ic ? ICONS[ic] : '', hasIcon: !!ic, noIcon: !ic,
        style: 'display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 16px;border-radius:20px;border:none;width:100%;text-align:left;color:#EEEFFA;font-size:17px;font-weight:600;transition:background-color 220ms ease, box-shadow 220ms ease;' + (isOn(k) ? 'background:rgba(169,157,255,0.28);box-shadow:inset 0 0 0 1.5px #A99DFF' : 'background:rgba(255,255,255,0.06);box-shadow:inset 0 1px 0 rgba(255,255,255,0.08)'),
        radio: 'width:22px;height:22px;border-radius:50%;box-sizing:border-box;flex-shrink:0;' + (isOn(k) ? 'border:7px solid #A99DFF;background:#16132E' : 'border:2px solid rgba(255,255,255,0.3)'),
      })),
      showNext: !!q.multi, nextOff: q.multi && !st.goals.length,
      next: () => this.setState({ step: 1 }),
      nextStyle: 'position:absolute;left:24px;right:24px;bottom:60px;height:58px;border-radius:29px;border:none;font-size:18px;font-weight:700;' + (q.multi && !st.goals.length ? 'background:rgba(255,255,255,0.12);color:#6E7190' : 'background:#A99DFF;color:#16132E'),
      done: st.step === 2 && !!st.phone,
      back: () => this.setState({ step: Math.max(0, st.step - 1) }),
    };
  }
}
