<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { apps: [true, true, false] };
  }
  renderVals() {

    const seg = (labels, sel, pick, dark) => labels.map((label, i) => ({
      label,
      on: sel === i ? 'true' : 'false',
      pick: () => pick(i),
      style: 'border: none; border-radius: 8px; font-size: 13px; font-weight: 600; color: ' + (dark ? '#1A1205' : '#FFFFFF') + '; transition: background-color 200ms ease; ' +
        (sel === i ? 'background: ' + (dark ? '#FFFFFF' : '#636366') + '; box-shadow: 0 3px 8px rgba(0,0,0,0.12), 0 3px 1px rgba(0,0,0,0.04)' : 'background: transparent')
    }));
    const st = this.state;
    const all = [['메시지', '메', '#30D158'], ['지도', '지', '#0A84FF'], ['캘린더', '캘', '#FF453A']];
    const apps = all.filter((_, i) => st.apps[i]).map(([name, letter, col]) => ({
      name, letter, aria: name + ' 빼기',
      tile: 'width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: ' + col,
      remove: () => { const n = st.apps.slice(); n[all.findIndex((a) => a[0] === name)] = false; this.setState({ apps: n }); }
    }));
    return {
      apps, count: 2 + apps.length
    };
  }
}
</script>
