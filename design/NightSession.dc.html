<style>

body{margin:0}

.sheet{animation:sheet-in 500ms var(--ease-drawer) both}

@media (prefers-reduced-motion: reduce){.sheet{animation:fade-in 200ms ease both}}

.wv{animation:wv 8s linear infinite}@keyframes wv{to{transform:translateX(-390px)}}.up{animation:up 420ms cubic-bezier(0.32,0.72,0,1) both}@keyframes up{from{transform:translateY(100%)}}@media (prefers-reduced-motion: reduce){.wv,.up{animation:none}}</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { db: 41, ending: false };
    // 주변 소리 크기가 조금씩 바뀌어요
    this.timer = setInterval(() => this.setState({ db: 37 + Math.floor(Math.random() * 9) }), 1500);
  }
  renderVals() {

    return { db: this.state.db, ending: this.state.ending, askEnd: () => this.setState({ ending: true }), keep: () => this.setState({ ending: false }) };
  }
}
</script>
