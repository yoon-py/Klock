<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { g: { alarm: false, notif: false, screen: false } };
  }
  renderVals() {

    const g = this.state.g;
    const row = (k) => ({ on: g[k], label: g[k] ? '허용됨' : '허용하기', style: 'height:34px;padding:0 14px;border-radius:17px;border:none;font-size:15px;font-weight:600;' + (g[k] ? 'background:transparent;color:#34C759' : 'background:rgba(169,157,255,0.2);color:#A99DFF'), tap: () => this.setState({ g: Object.assign({}, g, { [k]: true }) }) });
    const all = g.alarm && g.notif && g.screen;
    return { a: row('alarm'), n: row('notif'), s: row('screen'), all,
      allTap: () => this.setState({ g: { alarm: true, notif: true, screen: true } }), notAll: !all };
  }
}
</script>
