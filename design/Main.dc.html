<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: [true, false] };
  }
  renderVals() {

    const swg = (on) => ({
      on: on ? 'true' : 'false',
      track: 'width: 64px; height: 30px; border-radius: 999px; border: none; padding: 0; position: relative; flex-shrink: 0; transition: background-color 240ms ease; background: ' + (on ? '#FF9F0A' : 'rgba(120,120,128,0.32)'),
      knob: 'position: absolute; top: 2px; left: 2px; width: 38px; height: 26px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 3px 8px rgba(0,0,0,0.15); transition: transform 280ms cubic-bezier(0.23, 1, 0.32, 1); transform: translateX(' + (on ? '22px' : '0') + ')'
    });

    const st = this.state;
    const out = {};
    [0, 1].forEach((i) => {
      const on = st.on[i], s = swg(on);
      out['o' + i + 'On'] = s.on; out['o' + i + 'Track'] = s.track; out['o' + i + 'Knob'] = s.knob;
      out['t' + i] = () => { const n = st.on.slice(); n[i] = !n[i]; this.setState({ on: n }); };
      out['o' + i + 'Time'] = 'display: flex; align-items: baseline; gap: 4px; transition: color 200ms ease; color: ' + (on ? '#FFFFFF' : '#8E8E93');
      out['o' + i + 'Sub'] = 'font-size: 15px; transition: color 200ms ease; color: ' + (on ? '#FFFFFF' : '#8E8E93');
    });
    return out;
  }
}
</script>
