<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { clip: true };
  }
  renderVals() {

    const sw = (on, color) => ({
      on: on ? 'true' : 'false',
      track: 'width: 51px; height: 31px; border-radius: 999px; border: none; padding: 0; position: relative; flex-shrink: 0; transition: background-color 240ms ease; background: ' + (on ? (color || '#FFB547') : 'rgba(120,120,128,0.32)'),
      knob: 'position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 3px 8px rgba(0,0,0,0.15), 0 1px 1px rgba(0,0,0,0.16); transition: transform 280ms cubic-bezier(0.23, 1, 0.32, 1); transform: translateX(' + (on ? '20px' : '0') + ')'
    });
    const c = sw(this.state.clip);
    return { clipOn: c.on, clipTrack: c.track, clipKnob: c.knob, toggleClip: () => this.setState({ clip: !this.state.clip }) };
  }
}
</script>
