:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1)}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
a,button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform 160ms var(--ease-out),opacity 160ms var(--ease-out),background-color 160ms ease,color 160ms ease}
a:active,button:active{transform:scale(0.97)}
[data-row]:active{transform:none;background-color:rgba(255,255,255,0.06)!important}
[data-plain]:active,[role=switch]:active,nav a:active{transform:none}
nav a:active{opacity:0.55}
.sheet{animation:sheet-in 500ms var(--ease-drawer) both}
@keyframes sheet-in{from{transform:translateY(100%)}}
@keyframes fade-in{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.sheet{animation:fade-in 200ms ease both}}
a:focus-visible,button:focus-visible{outline:2px solid #FF9F0A;outline-offset:2px}
.sheet>*{flex-shrink:0}.rise{animation:rise-in 460ms var(--ease-drawer) both}@keyframes rise-in{from{transform:translateY(100%)}}.dim{animation:dim-in 300ms ease both}@keyframes dim-in{from{opacity:0}}@media (prefers-reduced-motion: reduce){.rise,.dim{animation:dim-in 200ms ease both}}
@keyframes coach-pulse{0%{box-shadow:0 0 0 0 rgba(255,181,71,0.55),0 0 0 2000px rgba(2,2,8,0.74)}70%{box-shadow:0 0 0 14px rgba(255,181,71,0),0 0 0 2000px rgba(2,2,8,0.74)}100%{box-shadow:0 0 0 0 rgba(255,181,71,0),0 0 0 2000px rgba(2,2,8,0.74)}}
@keyframes coach-in{from{opacity:0;transform:translateY(6px)}}
.coach-spot{animation:coach-pulse 1.8s ease-out infinite;transition:left 380ms var(--ease-out),top 380ms var(--ease-out),width 380ms var(--ease-out),height 380ms var(--ease-out)}
.coach-bubble{animation:coach-in 320ms var(--ease-out) both}
@media (prefers-reduced-motion: reduce){.coach-spot{animation:none;box-shadow:0 0 0 2000px rgba(2,2,8,0.74);transition:none}.coach-bubble{animation:none}}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tour: 0, tourOff: false, missions: [0], sheet: true, at: null };
  }
  renderVals() { return Object.assign(this.baseVals(), this.tourVals()); }

  tourVals() {
    const STEPS = [{"n": 4, "rect": [16, 116, 358, 372, 18], "mode": "next", "title": "어떻게 깨울지 골라요", "body": "몸을 움직이거나(스쿼트·걷기), 침대에서 멀리 가거나(사진·바코드), 소리 내서(따라 말하기·리듬 맞춰 말하기) 깨워요. 여러 개 고르면 차례로 모두 끝내야 꺼져요."}, {"n": 5, "rect": [12, 156, 366, 72, 16], "pad": 4, "mode": "next", "title": "처음엔 스쿼트예요", "body": "폰을 두 손으로 잡고 앉았다 일어나면 폰의 움직임 센서가 세요. 카메라는 쓰지 않아요. 고른 미션 칸을 누르면 자세히 정할 수 있어요.", "nextLabel": "스쿼트 열어 보기", "href": "TourMissionSet.dc.html"}];
    const st = this.state;
    const i = st.tour || 0;
    const s = STEPS[i];
    const on = !st.tourOff && !!s;
    if (!on) return { tourOn: false, tourCover: false, tourIsNext: false, tourIsTap: false, tourDots: [], tb1: '', tb2: '', tb3: '', tb4: '', tourHole: '', tourSpot: '', tourBubble: '', tourArrow: '', tourTitle: '', tourBody: '', tourCount: '', tourHint: '', tourNextLabel: '', tourNext: () => {} };
    const [x, y, w, h, r] = s.rect;
    const pad = s.pad || 6;
    const L = x - pad, T = y - pad, Wd = w + pad * 2, Ht = h + pad * 2;
    const blk = 'position: absolute; z-index: 40; ';
    const H = 844;
    const below = s.below !== undefined ? s.below : (y + h / 2) < H * 400 / 844;
    const cx = x + w / 2;
    const arrowLeft = Math.max(22, Math.min(300, cx - 24 - 9));
    const total = 16;
    const n = s.n;
    return {
      tourOn: true,
      tourCover: s.mode !== 'tap' && !s.live,
      tourIsNext: s.mode !== 'tap',
      tourIsTap: s.mode === 'tap',
      tourDots: Array.from({ length: total }, (_, k) => 'width: ' + (k === n - 1 ? 16 : 6) + 'px; height: 6px; border-radius: 3px; background: ' + (k < n ? '#FFB547' : 'rgba(26,18,5,0.16)') + '; transition: width 300ms ease'),
      tb1: blk + 'left: 0; right: 0; top: 0; height: ' + T + 'px',
      tb2: blk + 'left: 0; right: 0; top: ' + (T + Ht) + 'px; bottom: 0',
      tb3: blk + 'left: 0; width: ' + L + 'px; top: ' + T + 'px; height: ' + Ht + 'px',
      tb4: blk + 'left: ' + (L + Wd) + 'px; right: 0; top: ' + T + 'px; height: ' + Ht + 'px',
      tourHole: blk + 'left: ' + L + 'px; top: ' + T + 'px; width: ' + Wd + 'px; height: ' + Ht + 'px',
      tourSpot: 'position: absolute; z-index: 41; pointer-events: none; box-sizing: border-box; border: 2px solid #FFB547; left: ' + L + 'px; top: ' + T + 'px; width: ' + Wd + 'px; height: ' + Ht + 'px; border-radius: ' + (r + pad) + 'px',
      tourBubble: 'position: absolute; z-index: 42; left: 20px; right: 20px; box-sizing: border-box; padding: 14px 18px 16px; border-radius: 22px; background: #FBF6EC; color: #17130C; box-shadow: 0 18px 40px rgba(0,0,0,0.5); ' + (below ? 'top: ' + (T + Ht + 16) + 'px' : 'bottom: ' + (H - T + 16) + 'px'),
      tourArrow: 'position: absolute; left: ' + arrowLeft + 'px; width: 18px; height: 18px; background: #FBF6EC; border-radius: 3px; transform: rotate(45deg); ' + (below ? 'top: -7px' : 'bottom: -7px'),
      tourTitle: s.title,
      tourBody: s.body,
      tourCount: n + ' / ' + total,
      tourHint: s.hint || '',
      tourNextLabel: s.nextLabel || '다음',
      tourNext: () => { if (s.href) { window.location.href = s.href; return; } this.setState({ tour: i + 1 }); }
    };
  }

  baseVals() {

    const S0 = this.state, me = this;
    const MN = ["스쿼트", "걷기", "사진 찍기", "바코드 찍기", "따라 말하기", "리듬 맞춰 말하기"], MBG = ["#3A2F57", "#3A2F57", "#4A2229", "#4A2229", "#1F3A47", "#1F3A47"];
    const COUNT_HREF = {"0": "MissionCountSquat.dc.html", "1": "MissionCountWalk.dc.html", "2": "MissionPhotoSet.dc.html", "3": "CodeRegister.dc.html", "5": "MissionRhythmSet.dc.html"};
    const mbuzz = () => { try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {} };
    const list = S0.missions, at = S0.at;
    const obj = (w) => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return c >= 0 && c % 28 ? '을' : '를'; };
    const mv = {
      missionCount: list.length + '/5',
      missionLine: list.length === 1 ? MN[list[0]] + obj(MN[list[0]]) + ' 끝내야 알람이 꺼져요.' : list.map((k) => MN[k]).join(' → ') + ' 순서로 모두 끝내야 꺼져요.',
      sheetOpen: !!S0.sheet,
      closeSheet: () => me.setState({ sheet: false, at: null })
    };
    for (let i = 0; i < 5; i++) {
      const k = i < list.length ? list[i] : -1, empty = k < 0, next = i === list.length, p = 's' + i;
      mv[p + 'Empty'] = empty;
      for (let j = 0; j < 6; j++) mv[p + 'K' + j] = k === j;
      mv[p + 'Aria'] = empty ? '미션 더하기' : (i + 1) + '번째 미션 ' + MN[k] + (COUNT_HREF[k] ? ', 눌러서 설정' : ', 눌러서 바꾸기');
      mv[p + 'Tap'] = () => {
        mbuzz();
        if (!empty && COUNT_HREF[k]) { window.location.href = COUNT_HREF[k]; return; }
        me.setState({ sheet: true, at: empty ? null : i });
      };
      mv[p + 'Box'] = 'width: 100%; aspect-ratio: 1; box-sizing: border-box; border-radius: 14px; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background-color 200ms ease; ' +
        (empty ? 'border: 1px solid rgba(255,255,255,' + (next ? '0.14' : '0.07') + '); background: ' + (next ? '#3A3A3C' : 'transparent') : 'border: none; background: ' + MBG[k]);
      mv[p + 'PlusS'] = 'stroke: ' + (next ? '#FFFFFF' : '#636366');
      mv[p + 'CanRemove'] = !empty && list.length > 1;
      mv[p + 'Remove'] = () => { const n = list.slice(); n.splice(i, 1); mbuzz(); me.setState({ missions: n }); };
      mv[p + 'RemoveAria'] = empty ? '' : MN[k] + ' 빼기';
    }
    for (let j = 0; j < 6; j++) {
      const added = list.indexOf(j) >= 0, p = 'm' + j;
      mv[p + 'Added'] = added ? 'true' : 'false';
      mv[p + 'Pick'] = () => {
        if (added) return;
        const n = list.slice();
        if (at !== null && at !== undefined) n[at] = j; else if (n.length < 5) n.push(j);
        mbuzz(); me.setState({ missions: n, sheet: false, at: null });
      };
      mv[p + 'Row'] = 'display: flex; align-items: center; gap: 18px; width: 100%; min-height: 72px; padding: 8px 12px; border: none; border-radius: 16px; background: none; color: #FFFFFF; text-align: left; transition: opacity 200ms ease; cursor: ' + (added ? 'default' : 'pointer') + '; opacity: 1';
      mv[p + 'Check'] = 'margin-left: auto; flex-shrink: 0; opacity: ' + (added ? 1 : 0);
    }

    return mv;
  }
}
