<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { st: 'live', sound: false };
  }
  renderVals() {

    const sound = !!this.state.sound;
    const top = {
      sound, soundOn: sound ? 'true' : 'false',
      toggleSound: () => this.setState({ sound: !this.state.sound }),
      track: 'width: 62px; height: 30px; border-radius: 999px; border: none; padding: 0; position: relative; flex-shrink: 0; transition: background-color 240ms ease; background: ' + (sound ? '#FF9F0A' : '#3A3A3C'),
      knob: 'position: absolute; top: 2px; left: 2px; width: 38px; height: 26px; border-radius: 999px; background: #FFFFFF; transition: transform 280ms cubic-bezier(0.23, 1, 0.32, 1); transform: translateX(' + (sound ? '20px' : '0') + ')'
    };
    const go = (href, ms) => setTimeout(() => { window.location.href = href; }, ms);
const frame = (st) => 'position: absolute; inset: 0; border-radius: 20px; box-sizing: border-box; transition: border-color 200ms ease; border: 6px solid ' + (st === 'ok' ? '#34C759' : st === 'bad' ? '#FF453A' : '#1C1C1E');
    const st = this.state.st;
    return Object.assign(top, {
      frameS: frame(st), ok: st === 'done',
      msg: st === 'bad' ? '등록한 코드가 아니에요. 바디워시 병의 QR을 비춰 주세요' : st === 'ok' || st === 'done' ? '확인했어요' : 'QR코드/바코드를 사각형 안에 맞춰주세요',
      detect: () => {
        // 캔버스에서는 처음 한 번은 다른 코드, 두 번째에 통과해요
        if (st === 'live') { this.setState({ st: 'bad' }); return; }
        if (st === 'bad') { this.setState({ st: 'ok' }); setTimeout(() => this.setState({ st: 'done' }), 500); go('WakeDone.dc.html', 1900); }
      }
    });
  }
}
</script>
