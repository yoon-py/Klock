und: linear-gradient(0deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 100%)"></div><div style="position: absolute; left: 40px; right: 40px; top: 250px; height: 380px"><span aria-hidden="true" style="position: absolute; top: 0px; left: 0px; width: 30px; height: 30px; border-top: 3px solid #FFFFFF; border-left: 3px solid #FFFFFF"></span><span aria-hidden="true" style="position: absolute; top: 0px; right: 0px; width: 30px; height: 30px; border-top: 3px solid #FFFFFF; border-right: 3px solid #FFFFFF"></span><span aria-hidden="true" style="position: absolute; bottom: 0px; left: 0px; width: 30px; height: 30px; border-bottom: 3px solid #FFFFFF; border-left: 3px solid #FFFFFF"></span><span aria-hidden="true" style="position: absolute; bottom: 0px; right: 0px; width: 30px; height: 30px; border-bottom: 3px solid #FFFFFF; border-right: 3px solid #FFFFFF"></span></div><p style="position: absolute; left: 24px; right: 24px; bottom: 150px; margin: 0; font-size: 15px; text-align: center; color: #FFFFFF; text-shadow: 0 1px 4px rgba(0,0,0,0.6)">{{hint}}</p><button type="button" aria-label="찍기" onClick="{{shoot}}" style="position: absolute; left: 50%; bottom: 46px; width: 78px; height: 78px; margin-left: -39px; border-radius: 39px; border: 4px solid #FFFFFF; background: rgba(255,255,255,0.25); padding: 4px; z-index: 5"><span style="display: block; width: 100%; height: 100%; border-radius: 50%; background: #FFFFFF"></span></button><sc-if value="{{checking}}" hint-placeholder-val="{{ false }}"><div class="flash" style="position: absolute; inset: 0; background: #FFFFFF; z-index: 45"></div><div role="status" style="position: absolute; inset: 0; background: rgba(0,0,0,0.55); z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px"><svg class="spin" width="44" height="44" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2.4"></circle><path d="M11 2.5a8.5 8.5 0 0 1 8.5 8 <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { ph: 'live', tries: 0, sound: false };
  }
  renderVals() {

    const sound = !!this.state.sound;
    const top = {
      sound, soundOn: sound ? 'true' : 'false',
      toggleSound: () => this.setState({ sound: !this.state.sound }),
      track: 'width: 62px; height: 30px; border-radius: 999px; border: none; padding: 0; position: relative; flex-shrink: 0; transition: background-color 240ms ease; background: ' + (sound ? '#FF9F0A' : '#3A3A3C'),
      knob: 'position: absolute; top: 2px; left: 2px; width: 38px; height: 26px; border-radius: 999px; background: #FFFFFF; transition: transform 280ms cubic-bezier(0.23, 1, 0.32, 1); transform: translateX(' + (sound ? '20px' : '0') + ')'
    };
    const go = (href, ms) => setTimeout(() => { window.location.href = href; }, ms);

    const ph = this.state.ph, tries = this.state.tries;
    return Object.assign(top, {
      checking: ph === 'check', fail: ph === 'fail', ok: ph === 'ok',
      hint: tries === 0 ? '세면대로 가서 네모 안에 들어오게 찍으세요' : '같은 방향에서 다시 찍어 보세요',
      shoot: () => {
        if (this.state.ph !== 'live') return;
        this.setState({ ph: 'check' });
        // 캔버스에서는 처음 한 번은 '다른 곳', 두 번째에 통과해요
        setTimeout(() => {
          if (this.state.tries === 0) this.setState({ ph: 'fail' });
          else { this.setState({ ph: 'ok' }); go('WakeDone.dc.html', 1400); }
        }, 1300);
      },
      retry: () => this.setState({ ph: 'live', tries: this.state.tries + 1 })
    });
  }
}
</script>
