<style>
:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1)}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
a,button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform 160ms var(--ease-out),opacity 160ms var(--ease-out),background-color 160ms ease,color 160ms ease}
a:active,button:active{transform:scale(0.97)}
[data-row]:active{transform:none;background-color:rgba(255,255,255,0.06)!important}
[data-plain]:active,[role=switch]:active,nav a:active{transform:none}
nav a:active{opacity:0.55}
.sheet{animation:sheet-in 500ms var(--ease-drawer) both}
@keyframes sheet-in{from{transform:translateY(100%)}}
@keyframes fade-in{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.sheet{animation:fade-in 200ms ease both}}
a:focus-visible,button:focus-visible{outline:2px solid #FF9F0A;outline-offset:2px}
.sheet>*{flex-shrink:0}.rise{animation:rise-in 460ms var(--ease-drawer) both}@keyframes rise-in{from{transform:translateY(100%)}}.dim{animation:dim-in 300ms ease both}@keyframes dim-in{from{opacity:0}}@media (prefers-reduced-motion: reduce){.rise,.dim{animation:dim-in 200ms ease both}}</style>
</helmet>

play: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FF7B86" d="M9 4.5h6l1.4 2.2H19a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8.7a2 2 0 0 1 2-2h2.6z"></path><circle cx="12" cy="13" r="3.6" fill="none" stroke="#00000055" stroke-width="1.8"></circle></svg></span><span style="font-size: 18px">사진 찍기</span><svg width="20" height="16" viewBox="0 0 20 16" fill="none" stroke="#FF9F0A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{m2Check}}"><path d="M2 8.5l5 5L18 2.5"></path></svg></button><button type="button" onClick="{{m3Pick}}" aria-disabled="{{m3Added}}" style="{{m3Row}}"><span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 15px; background: #4A2229; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FF7B86" stroke-linecap="round" aria-hidden="true"><path d="M4 5v14M7 5v14M11 5v14M14 5v14M18 5v14M20.5 5v14" stroke-width="1.6"></path><path d="M8.8 5v14M16 5v14" stroke-width="0.9"></path></svg></span><span style="font-size: 18px">바코드 찍기</span><svg width="20" height="16" viewBox="0 0 20 16" fill="none" stroke="#FF9F0A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{m3Check}}"><path d="M2 8.5l5 5L18 2.5"></path></svg></button></div><div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 12px 0"><span style="font-size: 15px; color: #98989F; padding: 0 12px 4px">입으로 깨우는 미션</span><button type="button" onClick="{{m4Pick}}" aria-disabled="{{m4Added}}" style="{{m4Row}}"><span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 15px; background: #1F3A47; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5" fill="#6AD0F5"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5v3.5" fill="none" stroke="#6AD0F5" stroke-width="2" stroke-linecap="round"></path></svg></span><span style="font-size: 18px">따라 말하기</span><svg width="20" height="16" viewBox="0 0 20 16" fill="none" stroke="#FF9F0A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{m4Check}}"><path d="M2 8.5l5 5L18 2.5"></path></svg></button><button type="button" onClick="{{m5Pick}}" aria-disabled="{{m5Added}}" style="{{m5Row}}"><span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 15px; background: #1F3A47; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><g fill="#6AD0F5"><circle cx="7" cy="18.5" r="3"></circle><circle cx="17" cy="16.5" r="3"></circle><path d="M10 18.5V5.3a1 1 0 0 1 1.26-.97l8 2.2a1 1 0 0 1 .74.97v9"></path></g></svg></span><span style="font-size: 18px">리듬 맞춰 말하기</span><svg width="20" height="16" viewBox="0 0 20 16" fill="none" stroke="#FF9F0A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{m5Check}}"><path d="M2 8.5l5 5L18 2.5"></path></svg></button></div></div></sc-if>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1310}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { bed: 1410, wake: 420, drag: null, check: true, vol: 0.9, volDrag: false, missions: [0], sheet: false, at: null, leadMins: 60 };
  }
  renderVals() {

    const swg = (on) => ({
      on: on ? 'true' : 'false',
      track: 'width: 64px; height: 30px; border-radius: 999px; border: none; padding: 0; position: relative; flex-shrink: 0; transition: background-color 240ms ease; background: ' + (on ? '#FF9F0A' : 'rgba(120,120,128,0.32)'),
      knob: 'position: absolute; top: 2px; left: 2px; width: 38px; height: 26px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 3px 8px rgba(0,0,0,0.15); transition: transform 280ms cubic-bezier(0.23, 1, 0.32, 1); transform: translateX(' + (on ? '22px' : '0') + ')'
    });

    const seg = (labels, sel, pick, dark) => labels.map((label, i) => ({
      label,
      on: sel === i ? 'true' : 'false',
      pick: () => pick(i),
      style: 'border: none; border-radius: 8px; font-size: 13px; font-weight: 600; color: ' + (dark ? '#1A1205' : '#FFFFFF') + '; transition: background-color 200ms ease; ' +
        (sel === i ? 'background: ' + (dark ? '#FFFFFF' : '#636366') + '; box-shadow: 0 3px 8px rgba(0,0,0,0.12), 0 3px 1px rgba(0,0,0,0.04)' : 'background: transparent')
    }));
    const S0 = this.state, me = this;
    const MN = ["스쿼트", "걷기", "사진 찍기", "바코드 찍기", "따라 말하기", "리듬 맞춰 말하기"], MBG = ["#3A2F57", "#3A2F57", "#4A2229", "#4A2229", "#1F3A47", "#1F3A47"];
    const COUNT_HREF = {"0": "MissionCountSquat.dc.html", "1": "MissionCountWalk.dc.html", "2": "MissionPhotoSet.dc.html", "3": "CodeRegister.dc.html", "5": "MissionRhythmSet.dc.html"};
    const mbuzz = () => { try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {} };
    const list = S0.missions, at = S0.at;
    const obj = (w) => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return c >= 0 && c % 28 ? '을' : '를'; };
    const mv = {
      missionCount: list.length + '/5',
      missionLine: list.length === 1 ? MN[list[0]] + obj(MN[list[0]]) + ' 끝내야 알람이 꺼져요.' : list.map((k) => MN[k]).join(' → ') + ' 순서로 모두 끝내야 꺼져요.',
      sheetOpen: !!S0.sheet,
      closeSheet: () => me.setState({ sheet: false, at: null })
    };
    for (let i = 0; i < 5; i++) {
      const k = i < list.length ? list[i] : -1, empty = k < 0, next = i === list.length, p = 's' + i;
      mv[p + 'Empty'] = empty;
      for (let j = 0; j < 6; j++) mv[p + 'K' + j] = k === j;
      mv[p + 'Aria'] = empty ? '미션 더하기' : (i + 1) + '번째 미션 ' + MN[k] + (COUNT_HREF[k] ? ', 눌러서 설정' : ', 눌러서 바꾸기');
      mv[p + 'Tap'] = () => {
        mbuzz();
        if (!empty && COUNT_HREF[k]) { window.location.href = COUNT_HREF[k]; return; }
        me.setState({ sheet: true, at: empty ? null : i });
      };
      mv[p + 'Box'] = 'width: 100%; aspect-ratio: 1; box-sizing: border-box; border-radius: 14px; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background-color 200ms ease; ' +
        (empty ? 'border: 1px solid rgba(255,255,255,' + (next ? '0.14' : '0.07') + '); background: ' + (next ? '#3A3A3C' : 'transparent') : 'border: none; background: ' + MBG[k]);
      mv[p + 'PlusS'] = 'stroke: ' + (next ? '#FFFFFF' : '#636366');
      mv[p + 'CanRemove'] = !empty && list.length > 1;
      mv[p + 'Remove'] = () => { const n = list.slice(); n.splice(i, 1); mbuzz(); me.setState({ missions: n }); };
      mv[p + 'RemoveAria'] = empty ? '' : MN[k] + ' 빼기';
    }
    for (let j = 0; j < 6; j++) {
      const added = list.indexOf(j) >= 0, p = 'm' + j;
      mv[p + 'Added'] = added ? 'true' : 'false';
      mv[p + 'Pick'] = () => {
        if (added) return;
        const n = list.slice();
        if (at !== null && at !== undefined) n[at] = j; else if (n.length < 5) n.push(j);
        mbuzz(); me.setState({ missions: n, sheet: false, at: null });
      };
      mv[p + 'Row'] = 'display: flex; align-items: center; gap: 18px; width: 100%; min-height: 72px; padding: 8px 12px; border: none; border-radius: 16px; background: none; color: #FFFFFF; text-align: left; transition: opacity 200ms ease; cursor: ' + (added ? 'default' : 'pointer') + '; opacity: 1';
      mv[p + 'Check'] = 'margin-left: auto; flex-shrink: 0; opacity: ' + (added ? 1 : 0);
    }

    const LEADS = [30, 60, 90, 120];
    const leadText = (m) => {
        const h = Math.floor(m / 60), r = m % 60;
        if (h === 0) return r + '분 전';
        if (r === 0) return h + '시간 전';
        return h + '시간 ' + r + '분 전';
    };

    const st = this.state, self = this;
    const C = 160, R = 128, SIZE = 320, GOAL = 480, STEP = 5;
    const mod = (a, n) => ((a % n) + n) % n;
    const pad = (n) => String(n).padStart(2, '0');
    const fmt = (m) => (m < 720 ? '오전 ' : '오후 ') + (Math.floor(m / 60) % 12 || 12) + ':' + pad(m % 60);
    const pt = (m) => { const a = m / 1440 * 2 * Math.PI; return [C + R * Math.sin(a), C - R * Math.cos(a)]; };
    const snap = (m) => Math.round(m / STEP) * STEP;
    const buzz = () => { try { if (navigator.vibrate) navigator.vibrate(5); } catch (e) {} };
    // 5분 단위로 바뀔 때마다 햅틱. 30분보다 짧거나 23시간 30분보다 길면 움직이지 않아요.
    const setT = (bed, wake) => {
      bed = mod(bed, 1440); wake = mod(wake, 1440);
      const d = mod(wake - bed, 1440);
      if (d < 30 || d > 1410) return;
      if (bed === self.state.bed && wake === self.state.wake) return;
      buzz(); self.setState({ bed, wake });
    };
    const dur = mod(st.wake - st.bed, 1440), ok = dur >= GOAL;
    const [x0, y0] = pt(st.bed), [x1, y1] = pt(st.wake);
    const col = ok ? '#FFD60A' : '#636366';
    const ringDown = (e) => {
      const el = e && e.currentTarget; if (!el) return;
      const r = el.getBoundingClientRect(), k = r.width / SIZE;
      const at = (ev) => { const dx = (ev.clientX - r.left) / k - C, dy = (ev.clientY - r.top) / k - C;
        return { m: mod(Math.atan2(dx, -dy) / (2 * Math.PI) * 1440, 1440), d: Math.hypot(dx, dy) }; };
      const p = at(e);
      if (p.d < 96 || p.d > 166) return;
      const s = self.state, gap = (a, b) => Math.min(mod(a - b, 1440), mod(b - a, 1440));
      const nb = gap(p.m, s.bed), nw = gap(p.m, s.wake);
      let mode = null;
      if (Math.min(nb, nw) <= 40) mode = nb <= nw ? 'bed' : 'wake';          // 양 끝 손잡이: 늘이거나 줄이기
      else if (mod(p.m - s.bed, 1440) <= mod(s.wake - s.bed, 1440)) mode = 'all'; // 바 가운데: 길이는 그대로 옮기기
      if (!mode) return;
      if (e.preventDefault) e.preventDefault();
      const b0 = s.bed, w0 = s.wake, d0 = mod(w0 - b0, 1440); let prev = p.m, acc = 0;
      const clampD = (d) => Math.max(30, Math.min(1410, d));
      self.setState({ drag: mode });
      const move = (ev) => {
        const q = at(ev); let dm = q.m - prev;
        if (dm > 720) dm -= 1440; if (dm < -720) dm += 1440;
        prev = q.m; acc += dm;
        // 손잡이를 너무 멀리 끌면 가장 짧거나 긴 시간(30분~23시간 30분)에 멈춰요.
        if (mode === 'bed') setT(w0 - clampD(d0 - snap(acc)), w0);
        else if (mode === 'wake') setT(b0, b0 + clampD(d0 + snap(acc)));
        else setT(snap(b0 + acc), snap(b0 + acc) + d0);
      };
      const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); self.setState({ drag: null }); };
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
    };
    const keyFor = (which) => (e) => {
      const dir = (e.key === 'ArrowUp' || e.key === 'ArrowRight') ? 1 : (e.key === 'ArrowDown' || e.key === 'ArrowLeft') ? -1 : 0;
      if (!dir) return; if (e.preventDefault) e.preventDefault();
      const s = self.state;
      if (which === 'bed') setT(s.bed + dir * STEP, s.wake); else setT(s.bed, s.wake + dir * STEP);
    };
    const h = Math.floor(dur / 60), m = dur % 60;
    const durText = h + '시간' + (m ? ' ' + m + '분' : '');
    const c = swg(st.check);
    // 알람 음량 슬라이더
    const KW = 38;
    const setVol = (v) => { v = Math.max(0, Math.min(1, v)); if (Math.round(v * 20) !== Math.round(self.state.vol * 20)) buzz(); self.setState({ vol: v }); };
    const volDown = (e) => {
      const el = e && e.currentTarget; if (!el) return;
      if (e.preventDefault) e.preventDefault();
      const r = el.getBoundingClientRect();
      const at = (ev) => setVol((ev.clientX - r.left - KW / 2) / (r.width - KW));
      at(e); self.setState({ volDrag: true });
      const up = () => { window.removeEventListener('pointermove', at); window.removeEventListener('pointerup', up); self.setState({ volDrag: false }); };
      window.addEventListener('pointermove', at); window.addEventListener('pointerup', up);
    };
    const volKey = (e) => {
      const dir = (e.key === 'ArrowUp' || e.key === 'ArrowRight') ? 1 : (e.key === 'ArrowDown' || e.key === 'ArrowLeft') ? -1 : 0;
      if (!dir) return; if (e.preventDefault) e.preventDefault(); setVol(self.state.vol + dir * 0.1);
    };
    const vx = 'calc((100% - ' + KW + 'px) * ' + st.vol.toFixed(3) + ')';
    const knob = (which) => 'fill: ' + col + '; transition: fill 220ms ease' + (st.drag === which ? '; filter: drop-shadow(0 0 6px rgba(255,255,255,0.35))' : '');
    return Object.assign(mv, {
      arcD: 'M' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A ' + R + ' ' + R + ' 0 ' + (dur > 720 ? 1 : 0) + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2),
      arcS: 'stroke: ' + col + '; transition: stroke 220ms ease',
      knobS: 'fill: ' + col + '; transition: fill 220ms ease',
      iconS: 'fill: ' + (ok ? '#4D3F00' : '#E5E5EA') + '; transition: fill 220ms ease',
      bedT: 'translate(' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ')', wakeT: 'translate(' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ')',
      ringDown, ringAria: '취침 ' + fmt(st.bed) + ', 기상 ' + fmt(st.wake) + ', ' + durText,
      bedText: fmt(st.bed), wakeText: fmt(st.wake), bedKey: keyFor('bed'), wakeKey: keyFor('wake'),
      durText, goalText: ok ? '이렇게 시간을 지정하면 수면 목표를 충족합니다.' : '이렇게 시간을 지정하면 수면 목표를 충족하지 않습니다.',
      leadLabel: '잠들기 ' + leadText(st.leadMins),
      volDown, volKey, volNow: Math.round(st.vol * 100), volText: Math.round(st.vol * 100) + '퍼센트',
      volFill: 'position: absolute; left: 0; top: 19px; height: 6px; border-radius: 3px; background: #FF9F0A; width: calc(' + vx + ' + ' + (KW / 2) + 'px)',
      volKnob: 'position: absolute; top: 10px; left: ' + vx + '; width: ' + KW + 'px; height: 24px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(0,0,0,0.3); transition: transform 160ms ease; transform: scale(' + (st.volDrag ? 1.08 : 1) + ')',
      checkOn: c.on, checkTrack: c.track, checkKnob: c.knob, toggleCheck: () => this.setState({ check: !st.check })
    });
  }
}
</script>
