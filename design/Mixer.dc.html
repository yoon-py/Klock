<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { layers: [{ k: 'fire', v: 0.75 }, { k: 'rain', v: 0.5 }], off: 1 };
  }
  renderVals() {

    const st = this.state, SH = {"fire": "모닥불", "rain": "비", "sea": "파도", "train": "밤기차", "snow": "눈 오는 밤", "bugs": "풀벌레", "fan": "선풍기", "white": "백색 소음", "pink": "분홍 소음", "brown": "갈색 소음"};
    const OFF = ['15분', '30분', '1시간', '2시간', '아침까지'];
    return {
      rows: st.layers.map((l, i) => ({ k: l.k, name: SH[l.k], vol: Math.round(l.v * 100), pct: Math.round(l.v * 100) + '%',
        fill: 'position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#A99DFF;width:' + Math.round(l.v * 100) + '%',
        knob: 'position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.35);left:' + Math.round(l.v * 100) + '%',
        change: (e) => this.setState({ layers: st.layers.map((x, j) => j === i ? { k: x.k, v: Number(e.target.value) / 100 } : x) }),
        remove: () => this.setState({ layers: st.layers.filter((_, j) => j !== i) }) })),
      canAdd: st.layers.length < 3,
      offs: OFF.map((l, i) => ({ l, tap: () => this.setState({ off: i }), style: 'flex:1;height:34px;border:none;border-radius:9px;font-size:13px;font-weight:600;color:#fff;background:' + (st.off === i ? '#636366' : 'transparent') })),
      note: st.off === 4 ? '아침까지 틀면 밤사이 녹음은 쉬고, 움직임으로만 잠을 살펴요.' : '소리가 서서히 꺼진 뒤부터 밤사이 소리를 녹음해요.',
    };
  }
}
</script>
