      noises: N.map(([k, name, note]) => ({ k, name, note, art: NA[k], tap: () => tap(k), on: has(k), idx: st.layers.indexOf(k) + 1,
        wrap: 'position:relative;border-radius:20px;overflow:hidden;cursor:pointer;transition:box-shadow 220ms;' + ring(k) })),
      favRow: st.favs.map((k) => ({ name: SH[k], tap: () => tap(k), style: 'flex-shrink:0;height:40px;padding:0 14px 0 6px;border-radius:20px;border:none;display:flex;align-items:center;gap:8px;color:#EEEFFA;font-size:14px;font-weight:600;background:' + (has(k) ? 'rgba(169,157,255,0.28)' : 'rgba(255,255,255,0.08)'), k })),
      hasFavs: st.favs.length > 0,
      mixes: [['잠 안 오는 밤', ['rain', 'brown']], ['캠핑 온 기분', ['fire', 'bugs']], ['기차 여행', ['train', 'white']]].map(([n, ls]) => ({ n, sub: ls.map((x) => SH[x]).join(' + '), tap: () => this.setState({ layers: ls, playing: true }) })),
      mpOn: st.layers.length > 0, mpName: st.layers.map((x) => SH[x]).join(' + '),
      mpArts: st.layers.map((k, i) => ({ html: '', style: 'width:34px;height:34px;border-radius:11px;overflow:hidden;box-shadow:0 0 0 2px #1c1b33;margin-left:' + (i ? -10 : 0) + 'px', k })),
      play: () => this.setState({ playing: !st.playing }), playIc: st.playing ? 'display:block' : 'display:none', pauseIc: st.playing ? 'display:none' : 'display:block;margin-left:2px',
      toast: !!st.toast,
    };
  }
}
</script>
