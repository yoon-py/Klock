<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1230}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: {"a_social_3": true, "a_travel_0": true}, open: { social: true } };
  }
  renderVals() {

    const CATS = [["all", "모든 앱 및 카테고리", []], ["social", "소셜 미디어", ["X", "Threads", "Instagram", "메시지", "카카오톡", "텔레그램"]], ["games", "게임", ["쿠키런", "포켓몬 GO"]], ["ent", "엔터테인먼트", ["YouTube", "넷플릭스", "티빙"]], ["health", "건강 및 피트니스", ["건강", "피트니스"]], ["edu", "교육", ["듀오링고", "클래스101"]], ["prod", "생산성 및 금융", ["메일", "캘린더", "토스"]], ["shop", "쇼핑 및 음식", ["쿠팡", "배달의민족"]], ["travel", "여행", ["지도", "네이버 지도", "카카오맵"]], ["util", "유틸리티", ["계산기", "카메라"]]];
    const sel = this.state.sel, open = this.state.open, out = {};
    const ring = (on) => 'width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; display: flex; align-items: center; justify-content: center; transition: background-color 160ms ease; ' + (on ? 'background: #FF9F0A; border: none' : 'background: none; border: 2px solid #5A5A5F');
    const setSel = (keys, on) => { const s = Object.assign({}, sel); keys.forEach((k) => { if (on) s[k] = true; else delete s[k]; }); this.setState({ sel: s }); };
    const allKeys = [];
    CATS.forEach(([cid, , apps]) => apps.forEach((_, i) => allKeys.push('a_' + cid + '_' + i)));
    const put = (k, on, aria, keys) => { out[k + 'On'] = on ? 'true' : 'false'; out[k + 'Ring'] = ring(on); out[k + 'Chk'] = 'opacity: ' + (on ? 1 : 0); out[k + 'Aria'] = aria; out[k + 'Tap'] = () => setSel(keys, !on); };
    CATS.forEach(([cid, name, apps]) => {
      const keys = cid === 'all' ? allKeys : apps.map((_, i) => 'a_' + cid + '_' + i);
      const n = keys.filter((k) => sel[k]).length;
      put('c_' + cid, keys.length > 0 && n === keys.length, name, keys);
      const isOpen = !!open[cid];
      out['c_' + cid + 'Open'] = isOpen; out['c_' + cid + 'Exp'] = isOpen ? 'true' : 'false';
      out['c_' + cid + 'Count'] = n > 0 ? String(n) : '';
      out['c_' + cid + 'Chev'] = 'transition: transform 200ms ease; transform: rotate(' + (isOpen ? 90 : 0) + 'deg)';
      out['c_' + cid + 'Toggle'] = () => this.setState({ open: Object.assign({}, open, { [cid]: !isOpen }) });
      apps.forEach((a, i) => { const k = 'a_' + cid + '_' + i; put(k, !!sel[k], a, [k]); });
    });
    return out;
  }
}
</script>
