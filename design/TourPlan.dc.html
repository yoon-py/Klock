<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>튜토리얼 - 알람 탭</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@200;300;400;500;600&amp;family=IBM+Plex+Sans+KR:wght@300;400;500;600&amp;display=swap">
<style>
:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1)}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
a,button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform 160ms var(--ease-out),opacity 160ms var(--ease-out),background-color 160ms ease,color 160ms ease}
a:active,button:active{transform:scale(0.97)}
[data-row]:active{transform:none;background-color:rgba(255,255,255,0.06)!important}
[data-plain]:active,[role=switch]:active,nav a:active{transform:none}
nav a:active{opacity:0.55}
.sheet{animation:sheet-in 500ms var(--ease-drawer) both}
@keyframes sheet-in{from{transform:translateY(100%)}}
@keyframes fade-in{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.sheet{animation:fade-in 200ms ease both}}
a:focus-visible,button:focus-visible{outline:2px solid #FF9F0A;outline-offset:2px}

@keyframes coach-pulse{0%{box-shadow:0 0 0 0 rgba(255,181,71,0.55),0 0 0 2000px rgba(2,2,8,0.74)}70%{box-shadow:0 0 0 14px rgba(255,181,71,0),0 0 0 2000px rgba(2,2,8,0.74)}100%{box-shadow:0 0 0 0 rgba(255,181,71,0),0 0 0 2000px rgba(2,2,8,0.74)}}
@keyframes coach-in{from{opacity:0;transform:translateY(6px)}}
.coach-spot{animation:coach-pulse 1.8s ease-out infinite;transition:left 380ms var(--ease-out),top 380ms var(--ease-out),width 380ms var(--ease-out),height 380ms var(--ease-out)}
.coach-bubble{animation:coach-in 320ms var(--ease-out) both}
@media (prefers-reduced-motion: reduce){.coach-spot{animation:none;box-shadow:0 0 0 2000px rgba(2,2,8,0.74);transition:none}.coach-bubble{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 0px; background: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Apple SD Gothic Neo', 'IBM Plex Sans KR', 'IBM Plex Sans', sans-serif; word-break: keep-all; font-variant-numeric: tabular-nums; position: relative; overflow: hidden; -webkit-font-smoothing: antialiased">

px; border-radius: 30px; background: rgba(44,44,46,0.92); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 8px 22px rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 11"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M13 4v18M4 13h18"></path></svg></a><div style="padding: 66px 24px 0"><span style="display: block; font-size: 40px; font-weight: 700; letter-spacing: -0.6px">알람</span><div style="margin-top: 52px; display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 700; padding-bottom: 12px; border-bottom: 0.5px solid rgba(84,84,88,0.65)"><svg width="26" height="18" viewBox="0 0 26 18" aria-hidden="true"><g fill="#FFFFFF"><rect x="1" y="9" width="24" height="5" rx="1.6"></rect><rect x="1" y="13" width="2.6" height="4.5" rx="1"></rect><rect x="22.4" y="13" width="2.6" height="4.5" rx="1"></rect><rect x="3" y="2" width="20" height="7.4" rx="2.2" fill="none" stroke="#FFFFFF" stroke-width="2"></rect><rect x="5.5" y="5.2" width="6.2" height="4" rx="1.4"></rect><rect x="14.3" y="5.2" width="6.2" height="4" rx="1.4"></rect></g></svg>수면 | 기상</div><div data-tour="plan" style="display: flex; align-items: center; gap: 12px; min-height: 120px; border-bottom: 0.5px solid rgba(84,84,88,0.65)"><span style="flex-grow: 1; font-size: 54px; font-weight: 300; letter-spacing: -1px; color: #6E6E73">알람 없음</span><a href="TourPlanEdit.dc.html" data-tour="change" style="height: 40px; padding: 0 16px; border-radius: 20px; background: #2C2C2E; color: #FF9F0A; font-size: 17px; font-weight: 600; display: flex; align-items: center; flex-shrink: 0">변경</a></div></div><nav aria-label="탭" style="position: absolute; left: 20px; right: 20px; bottom: 25px; height: 62px; box-sizing: border-box; padding: 4px; border-radius: 31px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); z-index: 10; background: rgba(38,38,42,0.55); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 0 0 0 0.5px rgba(255,255,255,0.08), 0 10px 30px rgba(0,0,0,0.45)"><a href="Main.dc.html" data-tour="tab-alarm" aria-current="page" style="border-radius: 27px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 10px; font-weight: 600; letter-spacing: 0.1px; color: #FFB547; background: rgba(255,255,255,0.12)"><svg width="25" height="25" viewBox="0 0 24 24" aria-hidden="true"><g fill="#FFB547"><path d="M5.6 2.6a1 1 0 0 1 .1 1.4L3.6 6.2a1 1 0 1 1-1.5-1.3l2.1-2.2a1 1 0 0 1 1.4-.1zm12.8 0a1 1 0 0 1 1.4.1l2.1 2.2a1 1 0 1 1-1.5 1.3L18.3 4a1 1 0 0 1 .1-1.4z"></path><path fill-rule="evenodd" d="M12 4.6a8.4 8.4 0 1 1 0 16.8 8.4 8.4 0 0 1 0-16.8zM13 8.6a1 1 0 1 0-2 0v4.3c0 .3.1.5.3.7l2.4 2.4a1 1 0 0 0 1.4-1.4L13 12.5z"></path></g></svg>알람</a><a href="SleepTab.dc.html" data-tour="tab-sleep" style="border-radius: 27px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 10px; font-weight: 500; letter-spacing: 0.1px; color: #A1A1A8; background: transparent"><svg width="25" height="25" viewBox="0 0 24 24" aria-hidden="true"><path fill="#A1A1A8" d="M20.6 14.7a.7.7 0 0 0-.9-.6 7.6 7.6 0 0 1-9.8-9.8.7.7 0 0 0-.6-.9 9 9 0 1 0 11.3 11.3z"></path></svg>수면</a><a href="Records.dc.html" data-tour="tab-report" style="border-radius: 27px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 10px; font-weight: 500; letter-spacing: 0.1px; color: #A1A1A8; background: transparent"><svg width="25" height="25" viewBox="0 0 24 24" aria-hidden="true"><g fill="#A1A1A8"><rect x="3.5" y="12.5" width="4.4" height="8" rx="1.4"></rect><rect x="9.8" y="7.5" width="4.4" height="13" rx="1.4"></rect><rect x="16.1" y="3.5" width="4.4" height="17" rx="1.4"></rect></g></svg>리포트</a></nav>

<sc-if value="{{tourOn}}" hint-placeholder-val="{{ true }}">
<div style="{{tb1}}"></div><div style="{{tb2}}"></div><div style="{{tb3}}"></div><div style="{{tb4}}"></div>
<sc-if value="{{tourCover}}" hint-placeholder-val="{{ false }}"><div style="{{tourHole}}"></div></sc-if>
<div class="coach-spot" aria-hidden="true" style="{{tourSpot}}"></div>
<div class="coach-bubble" role="dialog" aria-label="사용 안내" style="{{tourBubble}}">
  <span aria-hidden="true" style="{{tourArrow}}"></span>
  <div style="display: flex; align-items: center; justify-content: space-between; height: 22px">
    <span style="display: flex; gap: 5px; align-items: center"><sc-for list="{{tourDots}}" as="d" hint-placeholder-count="16"><span style="{{d}}"></span></sc-for></span>
  </div>
  <div style="margin-top: 8px; font-size: 19px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.3">{{tourTitle}}</div>
  <div style="margin-top: 6px; font-size: 15px; line-height: 1.5; color: #4A4236">{{tourBody}}</div>
  <sc-if value="{{tourIsNext}}" hint-placeholder-val="{{ true }}">
    <div style="margin-top: 14px; display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 13px; color: #8A7F6E">{{tourCount}}</span>
      <button type="button" onClick="{{tourNext}}" style="height: 42px; padding: 0 20px; border: none; border-radius: 21px; background: #1A1205; color: #FFB547; font-size: 15px; font-weight: 600">{{tourNextLabel}}</button>
    </div>
  </sc-if>
  <sc-if value="{{tourIsTap}}" hint-placeholder-val="{{ false }}">
    <div style="margin-top: 12px; display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 13px; color: #8A7F6E">{{tourCount}}</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #B36B00"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="#FFB547"></circle><circle cx="12" cy="12" r="10" fill="none" stroke="#FFB547" stroke-width="2" opacity="0.5"></circle></svg>{{tourHint}}</span>
    </div>
  </sc-if>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tour: 0, tourOff: false };
  }
  renderVals() { return Object.assign(this.baseVals(), this.tourVals()); }

  tourVals() {
    const STEPS = [{"n": 1, "rect": [24, 216, 342, 121, 12], "pad": 8, "mode": "tap", "title": "자고 일어날 시간부터 정해요", "body": "Slipper는 이 수면 일정에 맞춰 잠들기 전부터 아침까지 챙겨요. 변경을 눌러 보세요.", "hint": "변경을 눌러 보세요"}];
    const st = this.state;
    const i = st.tour || 0;
    const s = STEPS[i];
    const on = !st.tourOff && !!s;
    if (!on) return { tourOn: false, tourCover: false, tourIsNext: false, tourIsTap: false, tourDots: [], tb1: '', tb2: '', tb3: '', tb4: '', tourHole: '', tourSpot: '', tourBubble: '', tourArrow: '', tourTitle: '', tourBody: '', tourCount: '', tourHint: '', tourNextLabel: '', tourNext: () => {} };
    const [x, y, w, h, r] = s.rect;
    const pad = s.pad || 6;
    const L = x - pad, T = y - pad, Wd = w + pad * 2, Ht = h + pad * 2;
    const blk = 'position: absolute; z-index: 40; ';
    const H = 844;
    const below = s.below !== undefined ? s.below : (y + h / 2) < H * 400 / 844;
    const cx = x + w / 2;
    const arrowLeft = Math.max(22, Math.min(300, cx - 24 - 9));
    const total = 16;
    const n = s.n;
    return {
      tourOn: true,
      tourCover: s.mode !== 'tap' && !s.live,
      tourIsNext: s.mode !== 'tap',
      tourIsTap: s.mode === 'tap',
      tourDots: Array.from({ length: total }, (_, k) => 'width: ' + (k === n - 1 ? 16 : 6) + 'px; height: 6px; border-radius: 3px; background: ' + (k < n ? '#FFB547' : 'rgba(26,18,5,0.16)') + '; transition: width 300ms ease'),
      tb1: blk + 'left: 0; right: 0; top: 0; height: ' + T + 'px',
      tb2: blk + 'left: 0; right: 0; top: ' + (T + Ht) + 'px; bottom: 0',
      tb3: blk + 'left: 0; width: ' + L + 'px; top: ' + T + 'px; height: ' + Ht + 'px',
      tb4: blk + 'left: ' + (L + Wd) + 'px; right: 0; top: ' + T + 'px; height: ' + Ht + 'px',
      tourHole: blk + 'left: ' + L + 'px; top: ' + T + 'px; width: ' + Wd + 'px; height: ' + Ht + 'px',
      tourSpot: 'position: absolute; z-index: 41; pointer-events: none; box-sizing: border-box; border: 2px solid #FFB547; left: ' + L + 'px; top: ' + T + 'px; width: ' + Wd + 'px; height: ' + Ht + 'px; border-radius: ' + (r + pad) + 'px',
      tourBubble: 'position: absolute; z-index: 42; left: 20px; right: 20px; box-sizing: border-box; padding: 14px 18px 16px; border-radius: 22px; background: #FBF6EC; color: #17130C; box-shadow: 0 18px 40px rgba(0,0,0,0.5); ' + (below ? 'top: ' + (T + Ht + 16) + 'px' : 'bottom: ' + (H - T + 16) + 'px'),
      tourArrow: 'position: absolute; left: ' + arrowLeft + 'px; width: 18px; height: 18px; background: #FBF6EC; border-radius: 3px; transform: rotate(45deg); ' + (below ? 'top: -7px' : 'bottom: -7px'),
      tourTitle: s.title,
      tourBody: s.body,
      tourCount: n + ' / ' + total,
      tourHint: s.hint || '',
      tourNextLabel: s.nextLabel || '다음',
      tourNext: () => { if (s.href) { window.location.href = s.href; return; } this.setState({ tour: i + 1 }); }
    };
  }

  baseVals() {
return {};
  }
}
</script>
</body>
</html>
