lor: #C9C2FF; font-size: 16px; font-weight: 600">+ 장면 하나 더 섞기 · 창밖에 내리는 비</button></sc-if><p style="margin: 12px 0 0; font-size: 13px; color: #A3A7C2">장면은 2개까지 섞을 수 있어요. 배경 화면은 장면 1을 따라가요.</p></div></sc-if><sc-if value="{{more}}" hint-placeholder-val="{{ false }}"><div onClick="{{closeAll}}" style="position: absolute; inset: 0; background: rgba(0,0,0,0.35); z-index: 40"></div><div role="menu" class="up" style="position: absolute; left: 8px; right: 8px; bottom: 8px; padding: 10px 12px 26px; border-radius: 34px; background: rgba(40,40,48,0.92); -webkit-backdrop-filter: blur(28px); backdrop-filter: blur(28px); z-index: 41; display: flex; flex-direction: column"><span aria-hidden="true" style="display: block; width: 40px; height: 5px; margin: 0 auto 8px; border-radius: 3px; background: rgba(255,255,255,0.3)"></span><a role="menuitem" href="SoundSheet.dc.html" style="height: 56px; padding: 0 12px; display: flex; align-items: center; gap: 12px; font-size: 17px"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><g fill="#C9C2FF"><circle cx="7" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle><path d="M9 18V6.2l12-2.7V16h-1.8V7.3L10.8 9.2V18z"></path></g></svg>다른 소리 고르기</a><a role="menuitem" href="NightSession.dc.html" style="height: 56px; padding: 0 12px; display: flex; align-items: center; gap: 12px; font-size: 17px"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#C9C2FF" d="M20.6 14.7a.7.7 0 0 0-.9-.6 7.6 7.6 0 0 1-9.8-9.8.7.7 0 0 0-.6-.9 9 9 0 1 0 11.3 11.3z"></path></svg>지금 소리 끄고 녹음 시작</a><button type="button" onClick="{{closeAll}}" style="margin-top: 6px; height: 50px; border: none; border-radius: 14px; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 17px">닫기</button></div></sc-if><sc-if value="{{ending}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 40"></div><div role="alertdialog" aria-label="수면 끝내기" class="up" style="po <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { scene: 'fire', sec: 1800, vBeat: 0.35, vA: 0.75, vB: 0.5, hasB: false, mix: false, more: false, ending: false };
    // 소리가 꺼질 때까지 남은 시간 (0이 되면 실제 앱에서는 4-1 녹음 화면으로 넘어가요)
    this.timer = setInterval(() => { if (this.state.sec > 0) this.setState({ sec: this.state.sec - 1 }); }, 1000);
  }
  renderVals() {

    const SCENES = [["fire", "장소", "타닥타닥 모닥불"], ["rain", "날씨", "창밖에 내리는 비"], ["sea", "자연", "달빛 아래 파도"], ["train", "장소", "밤기차 창가"], ["snow", "날씨", "소복소복 눈 오는 밤"], ["bugs", "자연", "여름밤 풀벌레"], ["fan", "일상", "선풍기 바람"]], FALLBACK = {"train": "linear-gradient(180deg, #1B2238 0%, #0E1220 100%)", "snow": "linear-gradient(180deg, #2A3142 0%, #12151E 100%)", "bugs": "linear-gradient(180deg, #14231C 0%, #0A110D 100%)", "fan": "linear-gradient(180deg, #23252B 0%, #111215 100%)"};
    const sc = this.state.scene;
    const scv = {}; ['fire', 'rain', 'sea'].forEach((k) => { scv['sc_' + k] = sc === k; });
    scv.fallbackBg = 'position: absolute; inset: 0; ' + (FALLBACK[sc] ? 'background: ' + FALLBACK[sc] : sc ? 'display: none' : 'background: #08080C');
    const cur = SCENES.find((s) => s[0] === sc);

    const KW = 26, me = this;
    const slider = (key) => {
      const v = me.state[key];
      const setV = (x) => me.setState({ [key]: Math.max(0, Math.min(1, x)) });
      const vx = 'calc((100% - ' + KW + 'px) * ' + v.toFixed(3) + ')';
      return {
        [key + 'Now']: Math.round(v * 100),
        [key + 'Down']: (e) => { const el = e && e.currentTarget; if (!el) return; if (e.preventDefault) e.preventDefault(); const r = el.getBoundingClientRect();
          const at = (ev) => setV((ev.clientX - r.left - KW / 2) / (r.width - KW)); at(e);
          const up = () => { window.removeEventListener('pointermove', at); window.removeEventListener('pointerup', up); };
          window.addEventListener('pointermove', at); window.addEventListener('pointerup', up); },
        [key + 'Key']: (e) => { const d = e.key === 'ArrowRight' || e.key === 'ArrowUp' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowDown' ? -1 : 0; if (!d) return; if (e.preventDefault) e.preventDefault(); setV(v + d * 0.1); },
        [key + 'Fill']: 'position: absolute; left: 0; top: 17px; height: 6px; border-radius: 3px; background: #A99DFF; width: calc(' + vx + ' + ' + KW / 2 + 'px)',
        [key + 'Knob']: 'position: absolute; top: 7px; left: ' + vx + '; width: ' + KW + 'px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.3)'
      };
    };

    const st = this.state;
    const mm = Math.floor(st.sec / 60), ss = st.sec % 60;
    const close = () => this.setState({ mix: false, more: false, ending: false });
    return Object.assign({}, scv, slider('vBeat'), slider('vA'), slider('vB'), {
      soundLine: (cur ? cur[1] + ' · ' + cur[2] : '소리 없음') + (st.hasB ? ' + 비' : '') + ' + 모노럴 비트',
      left: String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0'),
      nameA: cur ? cur[2] : '장면 없음', hasB: st.hasB,
      addB: () => this.setState({ hasB: true }), removeB: () => this.setState({ hasB: false }),
      mix: st.mix, more: st.more, ending: st.ending,
      openMix: () => this.setState({ mix: true }), openMore: () => this.setState({ more: true }), askEnd: () => this.setState({ ending: true }), closeAll: close
    });
  }
}
</script>
